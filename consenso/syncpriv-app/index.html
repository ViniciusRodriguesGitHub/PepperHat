            : (error?.code === 'permission-denied' ? 'Não foi possível salvar seu voto por uma restrição de acesso. Suas escolhas foram mantidas nesta tela. Avise o organizador para verificar a configuração da votação.' : 'Erro ao registrar voto. Verifique a conexão e tente novamente.'), 'error');
        } finally {
          setIsSubmitting(false);
        }
      };

      if (!eventData) {
        if (loadFailed) {
          return (
            <div className="min-h-screen flex flex-col bg-slate-50">
              {topBar && <ConsensoAppBar {...topBar} />}
              <div className="flex flex-col items-center justify-center p-6 flex-1">
                <div className="max-w-md text-center space-y-4">
                  <Icon name="AlertCircle" className="w-14 h-14 text-amber-500 mx-auto" />
                  <h1 className="text-xl font-bold text-slate-900">Não foi possível abrir esta reunião</h1>
                  <p className="text-slate-600 text-sm">
                    O link precisa dos dados da reunião (URL com <code className="text-xs bg-slate-100 px-1 rounded">?d=</code>) ou sincronização na nuvem ativa.
                    Peça ao organizador um link completo em <strong>Reunião criada</strong> ou <strong>Minhas reuniões</strong>.
                  </p>
                  <p className="text-xs text-slate-500">Sem internet, o modo só-navegador exige o link longo.</p>
                  <Button onClick={() => { window.location.hash = ''; window.location.reload(); }}>Ir ao início</Button>
                </div>
              </div>
            </div>
          );
        }
        return (
          <div className="min-h-screen flex flex-col bg-slate-50">
            {topBar && <ConsensoAppBar {...topBar} />}
            <div className="flex items-center justify-center flex-1">
              <div className="spinner w-12 h-12"></div>
            </div>
          </div>
        );
      }

      if (!organizerPreparation && eventData.config.votingOpened === false) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col"><ConsensoAppBar {...topBar} /><main className="max-w-xl mx-auto px-4 py-14 text-center flex-1 w-full"><div className="w-16 h-16 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="Lock" className="w-8 h-8 text-amber-700" /></div><h1 className="text-2xl font-bold mb-2">Votação em preparação</h1><p className="text-slate-600">O organizador ainda está definindo os dias e períodos válidos. Tente novamente depois que receber a confirmação de abertura.</p></main></div>
        );
      }

      const timeSlots = getTimeSlots();
      const displayDates = dates;
      const displayTimeSlots = timeSlots;
      const resultsAvailable = canViewResults(eventData, false);
      const managerViewing = organizerPreparation || Boolean(topBar?.adminSession && canManageEventId(eventId));

      const slotsInteractive = !isVotingClosed(eventData.config) && (organizerPreparation || eventData.config.votingOpened !== false) && (!hasVoted || editingChoices || organizerPreparation);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <ConsensoAppBar
            {...topBar}
            secondaryRow={
              <div className="max-w-7xl mx-auto px-4 py-3 w-full flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div className="min-w-0">
                  <div className={`inline-flex rounded-full px-3 py-1 mb-2 text-sm font-bold ${organizerPreparation ? 'bg-amber-100 text-amber-900' : 'bg-blue-100 text-blue-900'}`}>{organizerPreparation ? 'Etapa 1 · Configurar grade de votação' : managerViewing ? 'Etapa 2 · Meu voto como organizador' : 'Meu voto'}</div>
                  <h1 className="text-lg font-bold text-slate-900 truncate">{eventData.config.title}</h1>
                  <p className="text-sm text-slate-600 mt-1">{organizerPreparation ? 'Bloqueie os horários que ninguém poderá escolher. Isso não registra seu voto.' : 'Marque sua disponibilidade pessoal entre as opções permitidas.'}</p>
                  <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-slate-500 mt-1">
                    <span className="flex items-center gap-1"><Icon name="Calendar" className="w-4 h-4" />{displayDates.length} dias na grade</span>
                    <span className="flex items-center gap-1"><Icon name="Globe" className="w-4 h-4" />{timezone}</span>
                  </div>
                </div>
                {managerViewing && <div className="flex items-center gap-4 shrink-0">
                  <div className="text-right">
                    <div className="text-xs text-slate-500">Progresso</div>
                    <div className="font-semibold text-sm">{getVoteCount(eventData)}/{eventData.config.quorum}</div>
                  </div>
                  <div className="w-28 sm:w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                    <div className="h-full bg-blue-600 transition-all" style={{ width: `${Math.min(getVoteProgressPercentage(eventData), 100)}%` }} />
                  </div>
                </div>}
              </div>
            }
          />

          <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            {eventData.config.meetingInstructions && <Card className="mb-6 p-5 border-blue-200"><h2 className="font-semibold text-slate-900 mb-2">Orientações da reunião</h2><p className="text-sm text-slate-700 whitespace-pre-wrap break-words">{eventData.config.meetingInstructions}</p></Card>}
            {eventData.config.votingDeadline && <p className="mb-4 rounded-lg border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">Prazo para votar: <strong>{new Date(eventData.config.votingDeadline).toLocaleString('pt-BR', { timeZone: eventData.config.timeZone || 'America/Sao_Paulo' })}</strong> ({eventData.config.timeZone || 'America/Sao_Paulo'}). O resultado será definido automaticamente após esse horário.</p>}
            {!organizerPreparation && isVotingClosed(eventData.config) && !eventData.config.finalized && <p className="mb-4 rounded-lg bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900">Votos encerrados. {eventData.config.tallyOpenedAt ? 'O organizador está escolhendo o resultado final.' : 'O prazo terminou e o servidor fará a apuração automática; isso pode levar até um minuto.'}</p>}
            <div className={`${organizerPreparation ? 'bg-amber-700' : 'privacy-shield'} rounded-xl p-6 mb-6 text-white`}>
              <div className="flex items-start gap-4">
                <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0">
                  <Icon name="ShieldCheck" className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h2 className="text-lg font-bold mb-2">{organizerPreparation ? 'Configuração para todos os participantes' : 'Suas escolhas não são exibidas ao grupo'}</h2>
                  <ul className="space-y-1 text-sm text-blue-100">
                    <li className="flex items-center gap-2"><Icon name="Check" className="w-4 h-4" />Outros convidados não acessam sua grade individual</li>
                    <li className="flex items-center gap-2"><Icon name="Check" className="w-4 h-4" />O link do convite nunca inclui votos</li>
                    <li className="flex items-center gap-2"><Icon name="Check" className="w-4 h-4" />{organizerPreparation ? 'Os bloqueios valem para todos; seu voto vem na próxima etapa' : 'Desmarque apenas os períodos indisponíveis'}</li>
                    <li className="flex items-center gap-2"><Icon name="Check" className="w-4 h-4" />Apenas o consenso final será revelado</li>
                  </ul>
                </div>
              </div>
            </div>

            <Card className="mb-6 overflow-hidden">
              <CardHeader className="flex items-center justify-between bg-slate-50">
                <div>
                  <h2 className="font-semibold flex items-center gap-2"><Icon name="Clock" className="w-5 h-5" />{organizerPreparation ? 'Etapa 1: bloqueie as opções impossíveis' : 'Desmarque quando você não estiver disponível'}</h2>
                  <p className="text-xs text-slate-500 mt-1">{organizerPreparation ? 'Nesta etapa você define a grade para todos. Ao concluir, abrirá o painel para registrar seu próprio voto.' : 'Todos os períodos permitidos começam disponíveis.'}</p>
                </div>
                <span className="text-sm text-slate-500">{organizerPreparation ? `${blockedSlots.size} bloqueado${blockedSlots.size === 1 ? '' : 's'}` : `${selectedSlots.size} ${selectedSlots.size === 1 ? 'horário disponível' : 'horários disponíveis'}`}</span>
              </CardHeader>

              {slotsInteractive && (
                <div className="p-3 border-b bg-white flex flex-wrap items-center justify-between gap-2">
                  <p className="text-xs font-medium text-slate-600">{organizerPreparation ? 'Clique ou arraste para bloquear/desbloquear opções.' : 'Clique ou arraste para marcar/desmarcar sua disponibilidade.'}</p>
                  <div className="flex gap-2">
                    {organizerPreparation ? <><Button variant="outline" size="sm" onClick={() => setSlotsBlocked(allSlotKeys, false)}>Desbloquear tudo</Button><Button variant="outline" size="sm" onClick={() => setSlotsBlocked(allSlotKeys, true)}>Bloquear tudo</Button></> : <><Button variant="outline" size="sm" onClick={() => setSlotsNormalAvailable(allSlotKeys)}>Marcar tudo</Button><Button variant="outline" size="sm" onClick={() => setSlotsAvailability(allSlotKeys, false)}>Desmarcar tudo</Button></>}
                  </div>
                </div>
              )}

              <div className="p-4 overflow-x-auto">
                <div className="min-w-max">
                  <div className="flex">
                    <div className="w-20 flex-shrink-0"></div>
                    {displayDates.map(date => (
                      <div key={date.toISOString()} className="w-24 flex-shrink-0 text-center py-2 border-b">
                        <div className="text-xs text-slate-500 uppercase">{getDayName(date)}</div>
                        <div className="text-lg font-semibold">{getDayNumber(date)}</div>
                        <div className="text-xs text-slate-400">{getMonthName(date)}</div>
                        {slotsInteractive && !organizerPreparation && (
                          <button
                            type="button"
                            onClick={() => toggleSlotGroup(displayTimeSlots.map((time) => getSlotKey(date, time)))}
                            className="mt-1 text-[10px] text-blue-700 hover:underline"
                            title="Marcar ou desmarcar todos os períodos deste dia"
                          >
                            alternar dia
                          </button>
                        )}
                        {organizerPreparation && <button type="button" onClick={() => { const keys = timeSlots.map((time) => getSlotKey(date, time)); setSlotsBlocked(keys, !keys.every((key) => blockedSlots.has(key))); }} className="block mx-auto text-[10px] text-red-700 hover:underline">alternar bloqueio</button>}
                      </div>
                    ))}
                  </div>

                  {displayTimeSlots.map(time => {
                    const isSeparator = SEPARATOR_HOURS.includes(time);
                    const hourPeriod = eventData.config.granularity === 'hour' ? Object.values(HOUR_PERIODS).find((period) => period.hours[0] === time) : null;
                    const hourPeriodKeys = hourPeriod ? displayDates.flatMap((date) => hourPeriod.hours.map((hour) => getSlotKey(date, hour))) : [];
                    return (
                      <React.Fragment key={time}>
                      {hourPeriod && <div className="flex items-center justify-between gap-2 px-2 py-1.5 bg-slate-100 border-y text-xs"><strong>{hourPeriod.label}</strong><div className="flex gap-1">{organizerPreparation ? <><button type="button" onClick={() => setSlotsBlocked(hourPeriodKeys, true)} className="px-2 py-1 rounded bg-red-100 text-red-800">Bloquear período</button><button type="button" onClick={() => setSlotsBlocked(hourPeriodKeys, false)} className="px-2 py-1 rounded bg-white border text-slate-700">Desbloquear</button></> : <><button type="button" onClick={() => setSlotsNormalAvailable(hourPeriodKeys)} className="px-2 py-1 rounded bg-blue-100 text-blue-800">Marcar período</button><button type="button" onClick={() => setSlotsAvailability(hourPeriodKeys, false)} className="px-2 py-1 rounded bg-white border text-slate-700">Desmarcar</button></>}</div></div>}
                      <div className="flex">
                        <div className={`w-20 flex-shrink-0 py-2 pr-2 text-right text-sm font-medium flex flex-col items-end justify-center ${isSeparator ? 'border-b-4 border-red-400' : 'border-b'}`}>
                          <span>{eventData.config.granularity === 'shift' ? SHIFT_TIMES[time] : time === 'day' ? 'Dia' : time}</span>
                          {slotsInteractive && displayDates.length > 1 && !organizerPreparation && (
                            <button
                              type="button"
                              onClick={() => toggleSlotGroup(displayDates.map((date) => getSlotKey(date, time)))}
                              className="text-[10px] font-normal text-blue-700 hover:underline"
                              title="Marcar ou desmarcar este período em todos os dias"
                            >
                              todos dias
                            </button>
                          )}
                          {organizerPreparation && eventData.config.granularity !== 'hour' && <button type="button" onClick={() => { const keys = displayDates.map((date) => getSlotKey(date, time)); setSlotsBlocked(keys, !keys.every((key) => blockedSlots.has(key))); }} className="text-[10px] font-normal text-red-700 hover:underline">alternar bloqueio</button>}
                        </div>
                        {displayDates.map(date => {
                          const slotKey = getSlotKey(date, time);
                          const isSelected = selectedSlots.has(slotKey);
                          const isBlocked = blockedSlots.has(slotKey);
                          return (
                            <div key={slotKey} className={`w-24 flex-shrink-0 p-1 ${isSeparator ? 'border-b-4 border-red-400' : 'border-b'}`}>
                              <button
                                onPointerDown={(e) => { e.preventDefault(); handleMouseDown(slotKey); }}
                                onPointerEnter={() => handleMouseEnter(slotKey)}
                                aria-label={`${formatDate(date)} ${time}: ${isBlocked ? 'Bloqueado pelo organizador' : isSelected ? 'Disponível' : 'Indisponível'}`}
                                title={isBlocked ? 'Bloqueado pelo organizador' : undefined}
                                disabled={!slotsInteractive || (isBlocked && !organizerPreparation)}
                                style={{ touchAction: 'none' }}
                                className={`w-full h-10 rounded-md transition-all ${isBlocked ? 'bg-red-100 border-2 border-red-300' : organizerPreparation ? 'bg-green-50 border border-green-200' : isSelected ? 'bg-blue-600' : 'bg-slate-100 hover:bg-slate-200'} ${!slotsInteractive || (isBlocked && !organizerPreparation) ? 'cursor-not-allowed opacity-70' : 'cursor-pointer'}`}>
                                {isBlocked ? <Icon name="Ban" className="w-4 h-4 text-red-700 mx-auto" /> : organizerPreparation ? <Icon name="Check" className="w-4 h-4 text-green-600 mx-auto" /> : isSelected && <Icon name="Check" className="w-4 h-4 text-white mx-auto" />}
                              </button>
                            </div>
                          );
                        })}
                      </div>
                      </React.Fragment>
                    );
                  })}
                  {!organizerPreparation && allSlotKeys.length > 0 && allSlotKeys.every((key) => blockedSlots.has(key)) && <div className="p-8 text-center text-slate-500">O organizador bloqueou todos os períodos desta votação.</div>}
                </div>
              </div>

              <div className="p-4 bg-slate-50 border-t flex flex-wrap items-center gap-4 text-sm">
                <div className="flex items-center gap-2"><div className="w-6 h-6 bg-slate-100 rounded border"></div><span className="text-slate-600">Indisponível</span></div>
                <div className="flex items-center gap-2"><div className="w-6 h-6 bg-blue-600 rounded flex items-center justify-center"><Icon name="Check" className="w-3 h-3 text-white" /></div><span className="text-slate-600">Disponível</span></div>
                <div className="flex items-center gap-2"><div className="w-6 h-6 bg-red-100 border-2 border-red-300 rounded flex items-center justify-center"><Icon name="Ban" className="w-3 h-3 text-red-700" /></div><span className="text-slate-600">Bloqueado pelo organizador</span></div>
                <div className="flex items-center gap-2 ml-auto"><div className="w-6 h-1 bg-red-400"></div><span className="text-slate-600">Divisão período</span></div>
              </div>
            </Card>

            {!organizerPreparation && <Card className="p-6 mb-6">
              <h3 className="font-semibold flex items-center gap-2 mb-2"><Icon name="MessageCircle" className="w-5 h-5" />Comentário opcional</h3>
              <p className="text-sm text-slate-500 mb-3">Use para explicar restrições ou observações sem alterar sua disponibilidade.</p>
              <textarea value={comment} onChange={(e) => setComment(e.target.value.slice(0, 1000))} disabled={!slotsInteractive} rows="3" placeholder="Ex.: consigo chegar 15 minutos depois..." className="w-full border rounded-lg p-3 text-sm disabled:bg-slate-100" />
              <div className="mt-3 flex flex-col sm:flex-row gap-2">
                <label className="flex items-center gap-2 text-sm border rounded-lg p-3 flex-1 cursor-pointer"><input type="radio" name="commentVisibility" checked={commentVisibility === 'organizer'} onChange={() => setCommentVisibility('organizer')} disabled={!slotsInteractive} /><span><strong>Somente organizador</strong><br/><span className="text-xs text-slate-500">Não aparece para os demais convidados.</span></span></label>
                <label className="flex items-center gap-2 text-sm border rounded-lg p-3 flex-1 cursor-pointer"><input type="radio" name="commentVisibility" checked={commentVisibility === 'everyone'} onChange={() => setCommentVisibility('everyone')} disabled={!slotsInteractive} /><span><strong>Compartilhar com todos</strong><br/><span className="text-xs text-slate-500">Será exibido junto ao resultado final.</span></span></label>
              </div>
              <div className="text-xs text-slate-400 text-right mt-1">{comment.length}/1000</div>
            </Card>}

            <div className="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center">
              {eventData.config.finalized ? (
                <div className="w-full flex justify-end"><Button onClick={onViewResults}><Icon name="Eye" className="w-4 h-4 mr-2" />Consultar resultado final</Button></div>
              ) : !organizerPreparation && isVotingClosed(eventData.config) ? (<p className="text-sm text-slate-600">Não é possível votar ou alterar respostas após o encerramento. Acompanhe o resultado por este link.</p>) : hasVoted && !editingChoices ? (
                <div className="flex flex-col sm:flex-row gap-3 w-full sm:w-auto sm:ml-auto">
                  <Button variant="outline" onClick={() => setEditingChoices(true)} className="justify-center">
                    <Icon name="Pencil" className="w-4 h-4 mr-2" />Editar minhas escolhas
                  </Button>
                  {resultsAvailable && (
                    <Button onClick={onViewResults} className="justify-center">
                      <Icon name="Eye" className="w-4 h-4 mr-2" />Ver resultados
                    </Button>
                  )}
                </div>
              ) : (
                <>
                  <div className="text-sm text-slate-500">
                    {organizerPreparation ? 'Revise os bloqueios: após abrir, convidados poderão votar e a grade ficará fixa.' : editingChoices ? 'Desmarque os períodos indisponíveis e salve.' : 'Dica: clique e arraste para marcar ou desmarcar vários períodos'}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 items-end w-full max-w-2xl">
                    {!organizerPreparation && (
                      <div className={`rounded-lg p-1 transition-all ${nameError ? 'bg-red-50 ring-2 ring-red-500' : ''}`}>
                        <Label htmlFor="voter-name" className={`mb-1 block text-xs ${nameError ? 'text-red-700 font-semibold' : ''}`}>
                          <Icon name="User" className="w-4 h-4 inline mr-1" />Nome completo — obrigatório
                        </Label>
                        <Input
                          ref={nameInputRef}
                          id="voter-name"
                          value={localUserName}
                          onChange={(e) => { setLocalUserName(e.target.value); if (isValidFullName(e.target.value)) setNameError(false); }}
                          placeholder="Digite seu nome e sobrenome"
                          autoComplete="name"
                          maxLength={120}
                          required
                          aria-describedby="voter-name-help"
                          aria-invalid={nameError}
                          className={nameError ? 'border-red-500 focus:ring-red-500' : ''}
                        />
                        <p id="voter-name-help" className={nameError ? 'text-xs text-red-700 mt-1' : 'text-xs text-slate-500 mt-1'}>Informe nome e sobrenome, mesmo se já estiver conectado.</p>
                      </div>
                    )}
                    {!organizerPreparation && ['optional', 'required'].includes(eventData.config.emailMode) && <div className="rounded-lg p-1"><Label htmlFor="voter-email" className="mb-1 block text-xs">E-mail para receber o resultado {eventData.config.emailMode === 'required' ? '— obrigatório' : '(opcional)'}</Label><Input ref={emailInputRef} id="voter-email" type="email" autoComplete="email" maxLength={254} required={eventData.config.emailMode === 'required'} value={notificationEmail} onChange={(e) => { setNotificationEmail(e.target.value); setEmailError(false); }} aria-invalid={emailError} className={emailError ? 'border-red-500' : ''} /><p className="mt-1 text-xs text-slate-500">Usado para enviar o resultado desta reunião. Não é exibido aos outros convidados.</p></div>}
                    {!organizerPreparation && getRequiredInfoLabels(eventData.config).length > 0 && (
                      <fieldset ref={requiredInfoRef} className="w-full rounded-xl border p-4 sm:col-span-2">
                        <legend className="px-1 text-sm font-semibold">Informações obrigatórias</legend>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">{getRequiredInfoLabels(eventData.config).map((label, index) => <div key={index}><Label htmlFor={'voter-info-' + index} className="mb-1 block text-xs break-words">{index + 1}. {label} — obrigatório</Label><Input id={'voter-info-' + index} value={requiredInfo[index] || ''} onChange={(e) => { const value = e.target.value; setRequiredInfo((current) => { const next = [...current]; next[index] = value; return next; }); }} maxLength={300} required aria-invalid={requiredInfoError && !requiredInfo[index]?.trim()} className={requiredInfoError && !requiredInfo[index]?.trim() ? 'border-red-500' : ''} /></div>)}</div>
                        <p className="text-xs text-slate-500 mt-3">Respostas visíveis apenas para você e o organizador.</p>
                      </fieldset>
                    )}
                    {editingChoices && (
                      <Button variant="ghost" onClick={handleCancelEditChoices} className="order-2 sm:order-1">
                        Cancelar
                      </Button>
                    )}
                    <Button
                      onClick={handleSubmit}
                      disabled={isSubmitting}
                      className="order-1 sm:order-2"
                    >
                      {isSubmitting ? 'Enviando...' : organizerPreparation ? 'Confirmar grade e ir votar' : hasVoted ? (editingChoices ? 'Salvar alterações' : 'Atualizar voto') : 'Confirmar Voto'}
                    </Button>
                  </div>
                </>
              )}
            </div>
          </main>
        </div>
      );
    };

    const VoteSuccessScreen = ({ registeredUser, onUserRegistered, addToast, topBar, onGoHome, onFollowResult }) => {
      const [showRegistration, setShowRegistration] = useState(false);
      const isLoggedIn = Boolean(registeredUser || topBar?.adminSession || (window.consensoFirebaseUser && !window.consensoFirebaseUser.isAnonymous));

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <ConsensoAppBar {...topBar} />
          <main className="flex-1 flex items-center justify-center px-4 py-10">
            <Card className="w-full max-w-lg p-8 text-center">
              <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5">
                <Icon name="Check" className="w-10 h-10 text-green-700" />
              </div>
              <h1 className="text-2xl font-bold text-slate-900 mb-2">Voto feito com sucesso!</h1>
              <p className="text-slate-600">Suas escolhas foram enviadas ao gerenciador.</p>
              {!isLoggedIn && <p className="mt-4 text-sm text-slate-600">Para alterar seu voto, abra o mesmo link do convite neste mesmo navegador e aparelho. Não apague os dados do site. Em janela anônima ou outro navegador/aparelho, você será identificado como outro participante.</p>}

              {!isLoggedIn && !showRegistration && (
                <div className="mt-8 p-5 rounded-xl bg-blue-50 border border-blue-200">
                  <h2 className="font-semibold text-slate-900 mb-2">Que tal usar o Consenso gratuitamente?</h2>
                  <p className="text-sm text-slate-600 mb-4">Crie sua conta grátis para organizar reuniões e acompanhar suas convocações em um só lugar.</p>
                  <Button onClick={() => setShowRegistration(true)} className="w-full">Criar conta grátis</Button>
                </div>
              )}

              {!isLoggedIn && showRegistration && (
                <div className="mt-8 text-left border-t pt-6">
                  <h2 className="text-lg font-semibold text-center mb-4">Crie sua conta grátis</h2>
                  <GuestRegistrationForm
                    showSkip={false}
                    onSuccess={(user) => {
                      if (onUserRegistered) onUserRegistered(user);
                      setShowRegistration(false);
                      addToast(`Conta criada. Bem-vindo, ${user.name}!`, 'success');
                    }}
                    addToast={addToast}
                  />
                </div>
              )}

              <Button onClick={onFollowResult} className="mt-6 w-full">Acompanhar resultado</Button>
              <Button variant="ghost" onClick={onGoHome} className="mt-3">Ir para o início</Button>
            </Card>
          </main>
        </div>
      );
    };

    const ResultsScreen = ({ eventId, isManager, onBack, addToast, topBar }) => {
      const [eventData, setEventData] = useState(null);
      const [verdict, setVerdict] = useState(null);

      useEffect(() => {
        let cancelled = false, unsubscribe = null;
        const apply = () => {
          const event = getEvent(eventId); if (!event || cancelled) return;
          const saved = event.config.finalResult;
          setEventData(event);
          setVerdict(saved ? { ...saved, slots: (saved.slots || []).map((slot) => ({ ...slot, date: parseLocalDate(slot.date) })) } : { type: 'none', slots: [], totalVotes: getVoteCount(event), quorum: event.config.quorum });
        };
        tryHydrateEventFromInviteHash(); apply();
        const ownerUid = getEvent(eventId)?.config?.firebaseOwnerUid;
        if (ownerUid) (async () => { try { await ensureConsensoGuestFirebase(); if (!cancelled) unsubscribe = consensoSubscribeRemoteEvent(ownerUid, eventId, apply); } catch (error) { if (!cancelled) addToast('Atualize a página para acompanhar o resultado.', 'error'); } })();
        return () => { cancelled = true; if (unsubscribe) unsubscribe(); };
      }, [eventId]);

      const handleExportICal = (slot) => {
        const slotKey = `${formatDate(slot.date)}|${slot.time}`;
        const event = parseTimeSlot(slotKey, eventData.config.title);
        if (event) { downloadICal(event); addToast('Arquivo .ics baixado!', 'success'); }
      };

      const handleExportGoogle = (slot) => {
        const slotKey = `${formatDate(slot.date)}|${slot.time}`;
        const event = parseTimeSlot(slotKey, eventData.config.title);
        if (event) openGoogleCalendar(event);
      };

      const formatSlotDisplay = (slot) => {
        const dateStr = formatDisplayDateFull(slot.date);
        if (slot.time === 'day') return dateStr;
        if (slot.time === 'morning') return `${dateStr} - Manhã`;
        if (slot.time === 'afternoon') return `${dateStr} - Tarde`;
        if (slot.time === 'evening') return `${dateStr} - Noite`;
        return `${dateStr} às ${slot.time}`;
      };

      if (!eventData || !verdict) return <div className="min-h-screen flex items-center justify-center"><div className="spinner w-12 h-12"></div></div>;

      const quorumReached = hasReachedQuorum(eventData);
      const progressPercent = getVoteProgressPercentage(eventData);
      const sharedComments = (eventData.publicComments || []).length
        ? eventData.publicComments
        : eventData.votes.filter((vote) => vote.commentVisibility === 'everyone' && vote.comment);

      if (!eventData.config.finalized) {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col">
            <ConsensoAppBar {...topBar} />
            <main className="max-w-2xl mx-auto px-4 py-12 text-center flex-1 w-full">
              <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6"><Icon name="Lock" className="w-10 h-10 text-amber-600" /></div>
              <h1 className="text-2xl font-bold mb-2">Consenso em Andamento</h1>
              <p className="text-slate-600 mb-2">O resultado será revelado após a definição pelo organizador ou a apuração automática no prazo informado.</p>
              {isManager && <p className="text-sm text-slate-500 mb-6">Progresso atual: <strong>{getVoteCount(eventData)}/{eventData.config.quorum} participantes</strong></p>}

              {isManager && <Card className="p-6 mb-6">
                <div className="flex justify-between mb-4"><span className="text-slate-600">Progresso</span><span className="font-semibold">{getVoteCount(eventData)}/{eventData.config.quorum}</span></div>
                <div className="w-full h-4 bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-blue-600 transition-all" style={{ width: `${progressPercent}%` }} /></div>
                <p className="text-center text-sm text-slate-500 mt-2">{progressPercent}% completo</p>
              </Card>}

              <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <p className="text-sm text-blue-800">
                  <Icon name="Info" className="w-4 h-4 inline mr-1" />
                  Sua privacidade é mantida: ninguém pode ver os resultados parciais.
                </p>
              </div>
              <Button variant="outline" size="sm" onClick={onBack} className="mt-8">
                <Icon name="ArrowLeft" className="w-4 h-4 mr-2" />{isManager ? 'Voltar ao painel' : 'Voltar à votação'}
              </Button>
            </main>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <ConsensoAppBar
            {...topBar}
            secondaryRow={
              <div className="max-w-3xl mx-auto px-4 py-2 flex items-center justify-between">
                <h1 className="text-base font-semibold text-slate-800">{verdict.slots.length ? 'Resultado do Consenso' : 'Votação encerrada sem data definida'}</h1>
                <Button variant="ghost" size="sm" onClick={onBack}>
                  <Icon name="ArrowLeft" className="w-4 h-4 mr-2" />{isManager ? 'Painel' : 'Votação'}
                </Button>
              </div>
            }
          />

          <main className="max-w-3xl mx-auto px-4 py-8 flex-1 w-full">
            <div className="text-center mb-8">
              <Logo className="w-16 h-16 mx-auto mb-4" />
              <h1 className="text-2xl font-bold mb-2">{eventData.config.title}</h1>
              <p className="text-slate-600">{formatDisplayDateFull(eventData.config.startDate)} - {formatDisplayDateFull(eventData.config.endDate)}</p>
            </div>

            <div className="flex justify-center mb-8">
              {verdict.type === 'unanimous' ? (
                <div className="inline-flex items-center gap-2 px-4 py-2 bg-green-100 text-green-700 rounded-full text-sm font-medium">
                  <Icon name="Trophy" className="w-4 h-4" />Consenso Unânime!
                </div>
              ) : verdict.type === 'majority' ? (
                <div className="inline-flex items-center gap-2 px-4 py-2 bg-blue-100 text-blue-700 rounded-full text-sm font-medium">
                  <Icon name="Users" className="w-4 h-4" />Data definida sem unanimidade
                </div>
              ) : (
                <div className="inline-flex items-center gap-2 px-4 py-2 bg-amber-100 text-amber-700 rounded-full text-sm font-medium">
                  <Icon name="Clock" className="w-4 h-4" />Votação encerrada
                </div>
              )}
            </div>

            {verdict.slots.length > 0 ? (
              <div className="space-y-4 mb-8">
                <h2 className="text-lg font-semibold text-center">
                  {verdict.type === 'unanimous' ? 'Horário com 100% de concordância:' : verdict.reason === 'deadline' ? 'Horário definido automaticamente:' : 'Horário definido pelo organizador:'}
                </h2>
                {verdict.slots.map((slot, index) => (
                  <Card key={index} className={index === 0 ? 'border-green-400 ring-2 ring-green-100' : ''}>
                    <CardHeader className="flex items-center justify-between">
                      <CardTitle className="text-lg flex items-center gap-2">
                        {index === 0 && <Icon name="Trophy" className="w-5 h-5 text-amber-500" />}
                        {formatSlotDisplay(slot)}
                      </CardTitle>
                      {isManager && <div className="flex items-center gap-2 text-sm text-slate-500">
                        <Icon name="Users" className="w-4 h-4" />{slot.votes}/{verdict.totalVotes} votos
                      </div>}
                    </CardHeader>
                    <CardContent>
                      <div className="flex gap-2">
                        <Button variant="outline" size="sm" onClick={() => handleExportGoogle(slot)} className="flex-1">
                          <Icon name="ExternalLink" className="w-4 h-4 mr-2" />Google Calendar
                        </Button>
                        <Button variant="outline" size="sm" onClick={() => handleExportICal(slot)} className="flex-1">
                          <Icon name="Download" className="w-4 h-4 mr-2" />Download .ics
                        </Button>
                      </div>
                    </CardContent>
                  </Card>
                ))}
              </div>
            ) : (
              <div className="text-center py-12 bg-white rounded-xl border mb-8">
                <Icon name="Clock" className="w-12 h-12 text-slate-300 mx-auto mb-4" />
                <h3 className="text-lg font-medium mb-2">Nenhum horário selecionado</h3>
                <p className="text-slate-600">{verdict.reason === 'no-votes' ? 'O prazo terminou sem votos registrados. Nenhuma data foi definida.' : 'Não houve disponibilidade futura entre os votos recebidos. Combine uma nova votação com o organizador.'}</p>
              </div>
            )}

            {isManager && <Card className="p-6">
              <h3 className="font-semibold mb-4">Estatísticas</h3>
              <div className="grid grid-cols-3 gap-4 text-center">
                <div><div className="text-2xl font-bold text-blue-600">{getVoteCount(eventData)}</div><div className="text-sm text-slate-500">Votos</div></div>
                <div><div className="text-2xl font-bold">{eventData.config.quorum}</div><div className="text-sm text-slate-500">Quórum</div></div>
                <div><div className="text-2xl font-bold text-green-600">{progressPercent}%</div><div className="text-sm text-slate-500">Progresso</div></div>
              </div>
            </Card>}

            {sharedComments.length > 0 && (
              <Card className="p-6 mt-6">
                <h3 className="font-semibold flex items-center gap-2 mb-4"><Icon name="MessageCircle" className="w-5 h-5" />Comentários compartilhados</h3>
                <div className="space-y-3">{sharedComments.map((item) => <div key={item.id || item.userId} className="bg-slate-50 rounded-lg p-3"><div className="text-sm font-medium">{item.userName || 'Participante'}</div><div className="text-sm text-slate-600 whitespace-pre-wrap">{item.comment}</div></div>)}</div>
              </Card>
            )}

            <div className="mt-6 bg-green-50 border border-green-200 rounded-lg p-4">
              <p className="text-sm text-green-800 text-center">
                <Icon name="ShieldCheck" className="w-4 h-4 inline mr-1" />
                {verdict.slots.length ? 'O resultado foi definido sem exibir grades individuais aos participantes.' : 'A votação foi encerrada sem definir uma data.'}
              </p>
            </div>
          </main>
        </div>
      );
    };

    const ManagerDashboard = ({ eventId, onViewResults, onBack, onEditVote, addToast, topBar, onEventDeleted }) => {
      const [eventData, setEventData] = useState(null);
      const [copied, setCopied] = useState(false);
      const [commentsReviewed, setCommentsReviewed] = useState(false);
      const [selectedFinalSlot, setSelectedFinalSlot] = useState('');
      const [openingTally, setOpeningTally] = useState(false);

      useEffect(() => { loadEventData(); }, [eventId]);

      useEffect(() => {
        const refresh = () => {
          tryHydrateEventFromInviteHash();
          const ev = getEvent(eventId);
          if (ev) setEventData(ev);
        };
        const onStorage = (e) => {
          if (e.key === STORAGE_KEY || e.key === null) refresh();
        };
        const onVis = () => {
          if (document.visibilityState === 'visible') refresh();
        };
        window.addEventListener('storage', onStorage);
        document.addEventListener('visibilitychange', onVis);
        return () => {
          window.removeEventListener('storage', onStorage);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, [eventId]);

      useEffect(() => {
        let cancelled = false, unsubscribe = null;
        (async () => {
          const ownerUid = getEvent(eventId)?.config?.firebaseOwnerUid;
          if (!ownerUid || !consensoFirestoreReady()) return;
          try {
            await waitForConsensoFirebaseUser(ownerUid);
            await window.consensoCall('consensoPrepareOrganizerPanel', { ownerUid, eventId });
            if (cancelled) return;
            unsubscribe = consensoSubscribeRemoteEvent(ownerUid, eventId, () => { if (!cancelled) setEventData(getEvent(eventId)); });
          } catch (error) { if (!cancelled) addToast('Não foi possível sincronizar o painel. Atualize a página e tente novamente.', 'error'); }
        })();
        return () => { cancelled = true; if (unsubscribe) unsubscribe(); };
      }, [eventId]);

      const loadEventData = () => {
        const event = getEvent(eventId);
        if (event) setEventData(event);
      };

      const handleCopyLink = async () => {
        try { await navigator.clipboard.writeText(buildInviteLink(eventId)); setCopied(true); addToast('Link copiado!', 'success'); setTimeout(() => setCopied(false), 2000); }
        catch { addToast('Erro ao copiar', 'error'); }
      };

      const handleCopyReminder = async () => {
        if (!eventData) return;
        const missingCount = getMissingVotesCount(eventData);
        const message = generateReminderMessage(eventData.config.title, missingCount, buildInviteLink(eventId), eventData.config.quorum);
        try { await navigator.clipboard.writeText(message); addToast('Mensagem copiada!', 'success'); }
        catch { addToast('Erro ao copiar', 'error'); }
      };

      const handleOpenTally = async () => {
        const early = !hasStrictMajority(eventData);
        const warning = (early ? 'Você está antecipando a apuração antes de mais da metade dos participantes votar. ' : '') + 'Esta ação encerra a votação definitivamente. Ninguém poderá votar ou editar respostas depois. Você verá as opções e poderá escolher o resultado final. Não é possível voltar atrás. Deseja continuar?';
        if (!window.confirm(warning)) return;
        setOpeningTally(true);
        try { await openEventTally(eventId, early); loadEventData(); addToast('Votos encerrados. Escolha agora o resultado final.', 'success'); }
        catch (error) { addToast(error.message || 'Não foi possível abrir a apuração.', 'error'); }
        finally { setOpeningTally(false); }
      };
      const handleUnlockResults = async () => {
        if (!commentsReviewed) { addToast('Confirme que você revisou os comentários.', 'error'); return; }
        if (getVoteCount(eventData) === 0) { addToast('Aguarde pelo menos um voto antes de finalizar.', 'error'); return; }
        if (!selectedFinalSlot) { addToast('Escolha a data e o horário que serão definidos como resultado final.', 'error'); return; }
        const option = consensusOptions.find((slot) => slot.key === selectedFinalSlot);
        const voters = eventData.organizerSummary?.totalVotes || getVoteCount(eventData);
        if (option && option.votes < voters && !window.confirm(`Esse horário atende ${option.votes} de ${voters} participantes que votaram. Parte do grupo não estará disponível. Deseja publicar esse resultado definitivo?`)) return;
        try {
          await unlockResults(eventId, selectedFinalSlot);
          loadEventData();
          addToast('Votação finalizada e resultado revelado!', 'success');
        } catch (e) {
          addToast('Não foi possível finalizar. Tente novamente.', 'error');
        }
      };

      const handleDeleteEvent = async () => {
        if (!eventData) return;
        if (!window.confirm(`Excluir a reunião "${eventData.config.title}"? Os links deixarão de funcionar e os dados serão removidos (incluindo na nuvem, se aplicável).`)) return;
        try {
          await deleteEventForOrganizer(eventId);
          addToast('Reunião excluída.', 'success');
          onEventDeleted();
        } catch (e) {
          addToast(e?.message || 'Não foi possível excluir.', 'error');
        }
      };

      if (!eventData) return <div className="min-h-screen flex items-center justify-center"><div className="spinner w-12 h-12"></div></div>;

      const votedNames = getVotedUserNames(eventId);
      const missingCount = getMissingVotesCount(eventData);
      const progressPercent = getVoteProgressPercentage(eventData);
      const quorumReached = hasReachedQuorum(eventData);
      const voterComments = eventData.votes.filter((vote) => vote.comment && vote.comment.trim());
      const tallyReady = canChooseFinalResult(eventData);
      const majorityReached = hasStrictMajority(eventData);
      const consensusOptions = tallyReady ? (eventData.organizerSummary?.slots || (!eventData.config.firebaseOwnerUid ? rankConsensusSlots(eventData) : [])) : [];
      const optionIsPast = (slot) => {
        const zone = eventData.config.timeZone || 'America/Sao_Paulo';
        const dateStr = slot.key.split('|')[0];
        const today = new Intl.DateTimeFormat('en-CA', { timeZone: zone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        return slot.time === 'day' ? dateStr < today : window.ConsensoCore.zonedSlotTime(dateStr, slot.time, zone) < Date.now();
      };
      const formatConsensusOption = (slot) => {
        const date = formatDisplayDateFull(slot.date);
        if (slot.time === 'day') return date;
        if (slot.time === 'morning') return `${date} — Manhã`;
        if (slot.time === 'afternoon') return `${date} — Tarde`;
        if (slot.time === 'evening') return `${date} — Noite`;
        return `${date} às ${slot.time}`;
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <ConsensoAppBar
            {...topBar}
            secondaryRow={
              <div className="max-w-4xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <Logo className="w-6 h-6 shrink-0" />
                  <span className="font-semibold text-slate-800 truncate">Painel do organizador</span>
                </div>
              </div>
            }
          />

          <main className="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
            <div className="text-center mb-8">
              <h1 className="text-2xl font-bold mb-2">{eventData.config.title}</h1>
              <p className="text-slate-600">{formatDisplayDateFull(eventData.config.startDate)} - {formatDisplayDateFull(eventData.config.endDate)}</p>
            </div>

            {eventData.config.votingOpened !== false && <section className="mb-8 rounded-2xl border-2 border-blue-500 bg-blue-50 p-6 shadow-sm" aria-labelledby="invite-highlight-title">
              <div className="flex items-center gap-2 text-blue-900 mb-2"><Icon name="Send" className="w-6 h-6" /><h2 id="invite-highlight-title" className="text-xl font-bold">{isVotingClosed(eventData.config) ? 'Link da reunião e do resultado' : 'Agora convide os participantes'}</h2></div>
              <p className="text-slate-700 mb-4">{isVotingClosed(eventData.config) ? 'Os votos estão encerrados. Copie o link para compartilhar e acompanhar o resultado desta reunião.' : 'Basta copiar este link e enviar aos convidados pelo WhatsApp, e-mail ou onde preferir. Eles abrirão o link para informar sua disponibilidade no Consenso.'}</p>
              <Label htmlFor="organizer-invite-link">Link do convite da reunião</Label>
              <div className="flex flex-col sm:flex-row gap-3 mt-2"><Input id="organizer-invite-link" value={buildInviteLink(eventId)} readOnly className="bg-white text-sm flex-1" onFocus={(e) => e.target.select()} /><Button size="lg" onClick={handleCopyLink}><Icon name={copied ? 'Check' : 'Copy'} className="w-5 h-5 mr-2" />{copied ? 'Link copiado!' : isVotingClosed(eventData.config) ? 'Copiar link da reunião' : 'Copiar link e convidar'}</Button></div>
              {eventData.config.votingClosed && <p className="mt-3 text-sm text-amber-800">Os votos já estão encerrados; este link serve agora para acompanhar o resultado.</p>}
            </section>}
            {eventData.config.votingDeadline && <p className="mb-6 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">Prazo final: <strong>{new Date(eventData.config.votingDeadline).toLocaleString('pt-BR', { timeZone: eventData.config.timeZone || 'America/Sao_Paulo' })}</strong>. Se você não definir o resultado antes, o servidor encerrará e escolherá automaticamente a opção futura com mais disponíveis, desempatando pela mais próxima.</p>}
            <Card className="mb-6 border-blue-200">
              <CardContent className="p-4 bg-blue-50">
                <div className="flex items-start gap-3">
                  <Icon name="EyeOff" className="w-5 h-5 text-blue-600 mt-0.5" />
                  <div className="text-sm text-blue-800">
                    <strong>A interface não exibe grades individuais.</strong> Você acompanha quem votou, o progresso e os comentários. A apuração usa os votos armazenados e só é mostrada ao grupo depois da sua finalização.
                  </div>
                </div>
              </CardContent>
            </Card>

            <Card className="mb-6">
              <CardHeader><CardTitle className="flex items-center gap-2"><Icon name="TrendingUp" className="w-5 h-5 text-blue-600" />Progresso da Votação</CardTitle></CardHeader>
              <CardContent>
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <div className="text-3xl font-bold">{getVoteCount(eventData)} <span className="text-lg text-slate-500">/ {eventData.config.quorum}</span></div>
                    <div className="text-sm text-slate-500">votos recebidos</div>
                  </div>
                  <div className="text-right">
                    <div className="text-3xl font-bold text-blue-600">{progressPercent}%</div>
                    <div className="text-sm text-slate-500">do total esperado</div>
                  </div>
                </div>
                <div className="w-full h-4 bg-slate-200 rounded-full overflow-hidden mb-4">
                  <div className={`h-full transition-all ${quorumReached ? 'bg-green-500' : 'bg-blue-600'}`} style={{ width: `${Math.min(progressPercent, 100)}%` }} />
                </div>
                {quorumReached ? (
                  <div className="flex items-center gap-2 text-green-600 bg-green-50 p-3 rounded-lg">
                    <Icon name="CheckCircle" className="w-5 h-5" /><span className="font-medium">Total esperado alcançado. Encerre os votos para abrir as opções e escolher o resultado.</span>
                  </div>
                ) : (
                  <div className="flex items-center gap-2 text-amber-600 bg-amber-50 p-3 rounded-lg">
                    <Icon name="Lock" className="w-5 h-5" /><span className="font-medium">{isVotingClosed(eventData.config) ? 'Votos encerrados. Acompanhe a definição do resultado.' : 'Aguardando os votos dos participantes.'}</span>
                  </div>
                )}
              </CardContent>
            </Card>

            {getRequiredInfoLabels(eventData.config).length > 0 && <Card className="mb-6">
              <CardHeader><CardTitle>Identificação dos participantes</CardTitle><p className="text-sm text-slate-500">Respostas privadas para o organizador.</p></CardHeader>
              <CardContent><div className="space-y-4 max-h-96 overflow-y-auto">{eventData.votes.length ? eventData.votes.map((vote) => <div key={vote.userId} className="border rounded-xl p-4"><p className="font-semibold text-sm mb-3">{vote.userName || 'Participante'}</p><dl className="grid grid-cols-1 sm:grid-cols-2 gap-4">{getRequiredInfoLabels(eventData.config).map((label, index) => <div key={index} className="min-w-0"><dt className="text-xs text-slate-500 break-words">{label}</dt><dd className="text-sm text-slate-800 whitespace-pre-wrap break-words mt-1">{getRequiredInfoAnswers(vote)[index] || 'Não informado'}</dd></div>)}</dl></div>) : <p className="text-sm text-slate-500">Nenhum voto recebido.</p>}</div></CardContent>
            </Card>}

            <Card className="mb-6">
              <CardHeader><CardTitle className="flex items-center gap-2"><Icon name="MessageCircle" className="w-5 h-5 text-blue-600" />Comentários dos participantes ({voterComments.length})</CardTitle></CardHeader>
              <CardContent>
                {voterComments.length ? (
                  <div className="space-y-3 max-h-72 overflow-y-auto mb-4">
                    {voterComments.map((vote) => (
                      <div key={vote.userId} className="border rounded-lg p-3">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                          <span className="text-sm font-semibold">{vote.userName || 'Participante'}</span>
                          <span className={`text-xs px-2 py-1 rounded ${vote.commentVisibility === 'everyone' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'}`}>{vote.commentVisibility === 'everyone' ? 'Visível a todos no resultado' : 'Somente organizador'}</span>
                        </div>
                        <p className="text-sm text-slate-600 whitespace-pre-wrap">{vote.comment}</p>
                      </div>
                    ))}
                  </div>
                ) : <p className="text-sm text-slate-500 mb-4">Nenhum comentário foi enviado.</p>}
                <label className="flex items-start gap-3 p-3 bg-amber-50 border border-amber-200 rounded-lg cursor-pointer">
                  <input type="checkbox" checked={commentsReviewed} onChange={(e) => setCommentsReviewed(e.target.checked)} className="mt-1" />
                  <span className="text-sm text-amber-900"><strong>Revisei os comentários.</strong><br/>Entendo que finalizar bloqueará a apuração atual e revelará o resultado aos participantes.</span>
                </label>
              </CardContent>
            </Card>

            {!eventData.config.finalized && tallyReady && (
              <Card className="mb-6">
                <CardHeader><CardTitle className="flex items-center gap-2"><Icon name="CalendarCheck" className="w-5 h-5 text-blue-600" />Escolha do resultado final</CardTitle></CardHeader>
                <CardContent>
                  <p className="text-sm text-slate-600 mb-4">Todas as datas e horários escolhidos por pelo menos um participante aparecem abaixo, ordenados pela maior quantidade de votos. Selecione uma opção futura para definir o resultado que será revelado. Os votos já estão encerrados e não podem ser alterados.</p>
                  {consensusOptions.length ? (
                    <div className="space-y-2 max-h-80 overflow-y-auto">
                      {consensusOptions.map((slot) => (
                        <label key={slot.key} className={`flex items-center justify-between gap-3 p-3 border rounded-lg cursor-pointer transition-colors ${selectedFinalSlot === slot.key ? 'border-blue-500 bg-blue-50' : 'hover:bg-slate-50'}`}>
                          <span className="flex items-center gap-3 min-w-0">
                            <input type="radio" name="selectedFinalSlot" value={slot.key} disabled={optionIsPast(slot)} checked={selectedFinalSlot === slot.key} onChange={() => setSelectedFinalSlot(slot.key)} />
                            <span className="text-sm font-medium">{formatConsensusOption(slot)}{optionIsPast(slot) && <span className="text-xs text-slate-500 ml-2">(horário já passou)</span>}</span>
                          </span>
                          <span className="text-xs font-semibold whitespace-nowrap px-2 py-1 rounded-full bg-slate-100 text-slate-700">{slot.votes}/{eventData.organizerSummary?.totalVotes || getVoteCount(eventData)} votos</span>
                        </label>
                      ))}
                    </div>
                  ) : <p className="text-sm text-slate-500">As opções aparecerão assim que o primeiro voto for recebido.</p>}
                </CardContent>
              </Card>
            )}

            {!eventData.config.finalized && !tallyReady && <Card className="mb-6 border-amber-200"><CardHeader><CardTitle className="flex items-center gap-2"><Icon name="Lock" className="w-5 h-5" />Apuração protegida</CardTitle></CardHeader><CardContent>
              <p className="text-sm text-slate-600 mb-3">{majorityReached ? 'Mais da metade dos participantes já votou. Você pode encerrar os votos e abrir as opções, ou aguardar os demais.' : 'As datas e os horários escolhidos ficam ocultos até mais da metade do total esperado votar. Se necessário, você pode antecipar a apuração.'}</p>
              <p className="text-sm text-amber-900 mb-4"><strong>Sem volta:</strong> abrir a apuração encerra novos votos e alterações. Só depois disso as opções ficam visíveis.</p>
              <Button variant={majorityReached ? 'primary' : 'outline'} onClick={handleOpenTally} disabled={openingTally || getVoteCount(eventData) === 0 || isVotingClosed(eventData.config)}>{openingTally ? 'Encerrando votos...' : majorityReached ? 'Encerrar votos e abrir apuração' : 'Antecipar apuração e encerrar votos'}</Button>
              {getVoteCount(eventData) === 0 && <p className="text-xs text-slate-500 mt-2">Aguarde pelo menos um voto.</p>}
            </CardContent></Card>}
            <Card className={`mb-6 ${eventData.config.finalized ? 'border-green-300 bg-green-50' : 'border-blue-300 bg-blue-50'}`}>
              <CardContent className="p-6">
                {eventData.config.finalized ? (
                  <div><div className="flex items-center gap-2 text-green-800 font-semibold mb-3"><Icon name="CheckCircle" className="w-5 h-5" />Votação finalizada</div><Button onClick={onViewResults} className="w-full"><Icon name="Eye" className="w-4 h-4 mr-2" />Consultar resultado final</Button></div>
                ) : tallyReady ? (
                  <div><h3 className="font-semibold mb-1">Finalizar votação e revelar resultado</h3><p className="text-sm text-slate-600 mb-4">O resultado continua oculto mesmo após o quórum. Escolha uma opção acima e finalize apenas depois de conferir os comentários.</p><Button onClick={handleUnlockResults} disabled={!commentsReviewed || !selectedFinalSlot || getVoteCount(eventData) === 0} className="w-full"><Icon name="Flag" className="w-4 h-4 mr-2" />Finalizar e revelar resultado escolhido</Button></div>
                ) : <p className="text-sm text-slate-600">A escolha do resultado será liberada depois que você encerrar os votos e abrir a apuração.</p>}
              </CardContent>
            </Card>

            <div className="grid md:grid-cols-2 gap-6 mb-6">
              <Card>
                <CardHeader><CardTitle className="flex items-center gap-2 text-base"><Icon name="CheckCircle" className="w-4 h-4 text-green-600" />Já Votaram ({votedNames.length})</CardTitle></CardHeader>
                <CardContent>
                  {votedNames.length > 0 ? (
                    <ul className="space-y-2 max-h-48 overflow-y-auto">
                      {votedNames.map((name, i) => (
                        <li key={i} className="flex items-center gap-2 p-2 bg-slate-50 rounded-lg">
                          <div className="w-6 h-6 bg-blue-100 rounded-full flex items-center justify-center text-xs font-medium text-blue-600">{name.charAt(0).toUpperCase()}</div>
                          <span className="text-sm text-slate-700">{name}</span>
                        </li>
                      ))}
                    </ul>
                  ) : <p className="text-sm text-slate-500 text-center py-4">Ninguém votou ainda</p>}
                </CardContent>
              </Card>

              <Card>
                <CardHeader><CardTitle className="flex items-center gap-2 text-base"><Icon name="Settings" className="w-4 h-4 text-blue-600" />Ações</CardTitle></CardHeader>
                <CardContent className="space-y-3">
                  {eventData.config.votingOpened === false ? (
                    <Button onClick={onEditVote} className="w-full"><Icon name="Settings" className="w-4 h-4 mr-2" />Configurar grade e abrir votação</Button>
                  ) : (
                    <><Button variant="outline" onClick={handleCopyLink} className="w-full justify-between"><span className="flex items-center gap-2"><Icon name={copied ? 'Check' : 'Copy'} className="w-4 h-4" />Copiar Link</span></Button>{!isVotingClosed(eventData.config) && <Button variant="outline" onClick={onEditVote} className="w-full justify-between"><span className="flex items-center gap-2"><Icon name="Pencil" className="w-4 h-4" />Editar meu voto</span></Button>}</>
                  )}
                  {eventData.config.votingOpened !== false && !quorumReached && !isVotingClosed(eventData.config) && (
                    <Button variant="outline" onClick={handleCopyReminder} className="w-full justify-between">
                      <span className="flex items-center gap-2"><Icon name="MessageCircle" className="w-4 h-4" />Copiar Lembrete</span>
                    </Button>
                  )}
                  {eventData.config.finalized && (
                    <Button onClick={onViewResults} className="w-full"><Icon name="Eye" className="w-4 h-4 mr-2" />Ver Consenso</Button>
                  )}
                </CardContent>
              </Card>
            </div>

            <Card className="mb-6 border-red-200 bg-red-50/40">
              <CardHeader><CardTitle className="flex items-center gap-2 text-base text-red-900"><Icon name="Trash2" className="w-4 h-4" />Excluir reunião</CardTitle></CardHeader>
              <CardContent className="space-y-3">
                <p className="text-sm text-slate-600">Remove esta votação do armazenamento e da nuvem (Firebase). Participantes não conseguirão mais abrir o link.</p>
                <Button variant="outline" className="border-red-300 text-red-700 hover:bg-red-100" onClick={handleDeleteEvent}>
                  <Icon name="Trash2" className="w-4 h-4 mr-2" />Excluir permanentemente
                </Button>
              </CardContent>
            </Card>

          </main>
        </div>
      );
    };

    const App = () => {
      const [currentView, setCurrentView] = useState('home');
      const [currentEvent, setCurrentEvent] = useState(null);
      const [eventId, setEventId] = useState('');
      const [userName, setUserNameState] = useState('');
      const [isManager, setIsManager] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [adminSession, setAdminSessionState] = useState(() => getAdminSession());
      const [registeredUser, setRegisteredUserState] = useState(() => getRegisteredUser());
      const [pendingAfterLogin, setPendingAfterLogin] = useState(null);
      const [routeNonce, setRouteNonce] = useState(0);

      const addToast = (message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
      };

      const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      const goHome = () => {
        setCurrentView('home');
        window.location.hash = '';
      };

      useEffect(() => {
        let active = true;
        const restore = () => {
          if (!active) return;
          const user = window.consensoFirebaseUser;
          const previous = getAdminSession();
          const google = !user?.isAnonymous && user?.providerData?.find(provider => provider.providerId === 'google.com');
          if (google) {
            const session = { provider: 'google', sub: google.uid, firebaseUid: user.uid, email: user.email || google.email || '', name: user.displayName || '', picture: user.photoURL || '' };
            setAdminSession(session);
            setAdminSessionState(session);
            if (window.location.hash.startsWith('#manage/')) setRouteNonce(n => n + 1);
          } else if (previous?.firebaseUid || previous?.provider === 'google') {
            clearAdminSession();
            setAdminSessionState(null);
          }
          if (previous?.firebaseUid && previous.firebaseUid !== user?.uid) {
            setCurrentView(view => ['manage', 'create', 'share', 'vote', 'results'].includes(view) ? 'home' : view);
            setIsManager(false);
          }
        };
        window.addEventListener('consenso-firebase-auth', restore);
        if (window.consensoFirebaseAuthReady) window.consensoFirebaseAuthReady.then(restore);
        return () => { active = false; window.removeEventListener('consenso-firebase-auth', restore); };
      }, []);

      const applyRouteFromHash = () => {
        tryHydrateEventFromInviteHash();
        const raw = window.location.hash.replace(/^#/, '');
        if (raw.startsWith('event/')) {
          const id = raw.slice(6).split('?')[0].split('/')[0];
          setEventId(id);
          if (canManageEventId(id)) {
            const voter = getConsensoVoterUser(id);
            const voted = hasUserVoted(id, voter.id);
            const wantsToVote = new URLSearchParams(raw.split('?')[1] || '').has('voter');
            if (!voted || wantsToVote || getEvent(id)?.config?.votingOpened === false) {
              setIsManager(true);
              setCurrentView('vote');
            } else {
              setIsManager(true);
              setCurrentView('manage');
              window.location.hash = `manage/${id}`;
            }
          } else {
            setCurrentView('vote');
          }
          return;
        }
        if (raw.startsWith('manage/')) {
          const id = raw.slice(7).split('?')[0];
          setEventId(id);
          const uid = getAdminSession()?.firebaseUid;
          if (uid && !getEvent(id)) {
            const requestedHash = window.location.hash;
            consensoHydrateOrganizerEvent(uid, id).then(found => {
              if (window.location.hash !== requestedHash || getAdminSession()?.firebaseUid !== uid) return;
              if (found) applyRouteFromHash();
              else { addToast('Esta reunião não foi encontrada na sua conta.', 'error'); goHome(); }
            }).catch(() => {
              if (window.location.hash === requestedHash) { addToast('Não foi possível carregar a reunião. Verifique a conexão e abra o link novamente.', 'error'); goHome(); }
            });
            return;
          }
          if (canManageEventId(id)) {
            setIsManager(true);
            setCurrentView('manage');
          } else if (getAdminSession()) {
            addToast('Esta reunião pertence a outra conta de organizador.', 'error');
            goHome();
          } else {
            setPendingAfterLogin({ view: 'manage', eventId: id });
            setCurrentView('admin-login');
          }
          return;
        }
      };

      useEffect(() => {
        const user = getCurrentUser();
        if (user.name) setUserNameState(user.name);
        applyRouteFromHash();
        const onHash = () => applyRouteFromHash();
        window.addEventListener('hashchange', onHash);
        const onRemote = () => setRouteNonce((n) => n + 1);
        window.addEventListener('consenso-remote-hydrated', onRemote);
        return () => {
          window.removeEventListener('hashchange', onHash);
          window.removeEventListener('consenso-remote-hydrated', onRemote);
        };
      }, []);

      useEffect(() => {
        if (routeNonce === 0) return;
        applyRouteFromHash();
      }, [routeNonce]);

      const handleAdminLoginSuccess = () => {
        setAdminSessionState(getAdminSession());
        const p = pendingAfterLogin;
        setPendingAfterLogin(null);
        if (p?.view === 'create') {
          if (getAdminSession()?.firebaseUid) setCurrentView('create');
          else { setCurrentView('admin-events'); addToast('Dados locais recuperados. Para criar reuniões sincronizadas, entre com Google.', 'info'); }
        }
        else if (p?.view === 'manage' && p.eventId) {
          if (canManageEventId(p.eventId)) {
            setEventId(p.eventId);
            setIsManager(true);
            setCurrentView('manage');
            window.location.hash = `manage/${p.eventId}`;
          } else {
            addToast('Sem permissão para este painel ou reunião inexistente.', 'error');
            goHome();
          }
        } else if (p?.view === 'events') setCurrentView('admin-events');
        else goHome();
      };

      const handleAdminLoginCancel = () => {
        setPendingAfterLogin(null);
        goHome();
      };

      const openCreateFlow = () => {
        if (!getAdminSession()?.firebaseUid) {
          setPendingAfterLogin({ view: 'create' });
          setCurrentView('admin-login');
          return;
        }
        window.location.hash = '';
        setCurrentView('create');
      };

      const openMyEvents = () => {
        if (!getAdminSession()) {
          setPendingAfterLogin({ view: 'events' });
          setCurrentView('admin-login');
          return;
        }
        setCurrentView('admin-events');
      };

      const handleCreateEvent = (config) => {
        setCurrentEvent(config);
        setEventId(config.id);
        setIsManager(true);
        setCurrentView('share');
        /* Hash só após a tela de compartilhar, para o listener #manage/ não trocar a view. */
      };

      const handleShareComplete = () => {
        if (currentEvent?.votingOpened === false) {
          setCurrentView('vote');
          return;
        }
        if (currentEvent?.managerMode === 'participant') {
          setCurrentView('vote');
          setVoteHashFromInviteLink(currentEvent.id);
        } else {
          setCurrentView('manage');
          window.location.hash = `manage/${currentEvent.id}`;
        }
      };

      const handlePreparationComplete = (eventData) => {
        setCurrentEvent(eventData.config);
        setIsManager(true);
        setCurrentView('vote');
        setVoteHashFromInviteLink(eventData.config.id, true);
      };

      const handleVoteComplete = () => {
        if (isManager) handleBackToManage();
        else setCurrentView('vote-success');
      };
      const handleViewResults = () => setCurrentView('results');
      const handleBackToManage = () => {
        setCurrentView('manage');
        if (eventId) window.location.hash = `manage/${eventId}`;
      };
      const handleBackFromResults = () => {
        if (isManager) handleBackToManage();
        else {
          setCurrentView('vote');
          if (eventId) setVoteHashFromInviteLink(eventId);
        }
      };
      const handleSetUserName = (name) => { setUserNameState(name); setUserName(name); };

      const handleUserRegistered = (user) => {
        setRegisteredUserState(user);
      };

      const openEventFromDashboard = (id) => {
        if (canManageEventId(id)) {
          setEventId(id);
          setIsManager(true);
          setCurrentView('manage');
          window.location.hash = `manage/${id}`;
        } else {
          // Participante: ir para editar voto
          setEventId(id);
          setIsManager(false);
          setCurrentView('vote');
          setVoteHashFromInviteLink(id);
        }
      };

      const openOrganizerLogin = () => {
        setPendingAfterLogin({ view: 'events' });
        setCurrentView('admin-login');
      };

      const handleOrganizerLogout = async () => {
        try { if (window.consensoFirebaseSignOut) await window.consensoFirebaseSignOut(); }
        catch { addToast('Não foi possível sair da conta. Tente novamente.', 'error'); return; }
        clearAdminSession();
        setAdminSessionState(null);
        setIsManager(false);
        goHome();
        addToast('Sessão encerrada', 'info');
      };

      const handleRegisteredUserLogout = () => {
        logoutUser();
        setRegisteredUserState(null);
        addToast('Desconectado.', 'info');
      };

      const topBarNavigation = {
        adminSession,
        registeredUser,
        onGoHome: goHome,
        onMyEvents: openMyEvents,
        onOrganizerLogin: openOrganizerLogin,
        onLogout: adminSession ? handleOrganizerLogout : handleRegisteredUserLogout,
      };

      const renderCurrentView = () => {
        switch (currentView) {
          case 'admin-login':
            return <AdminLoginScreen onSuccess={handleAdminLoginSuccess} onCancel={handleAdminLoginCancel} />;
          case 'admin-events':
            return (
              <AdminEventsScreen
                onOpenEvent={openEventFromDashboard}
                onCreate={openCreateFlow}
                topBar={topBarNavigation}
                addToast={addToast}
                onUserRegistered={handleUserRegistered}
              />
            );
          case 'home':
            return (
              <HomeScreen
                adminSession={adminSession}
                registeredUser={registeredUser}
                onCreate={openCreateFlow}
                onMyEvents={openMyEvents}
                onOrganizerLogin={openOrganizerLogin}
                onLogout={adminSession ? handleOrganizerLogout : handleRegisteredUserLogout}
                onGoHome={goHome}
              />
            );
          case 'create':
            return <EventCreation onCreate={handleCreateEvent} onCancel={goHome} addToast={addToast} topBar={topBarNavigation} />;
          case 'share':
            return currentEvent && <ShareScreen event={currentEvent} onComplete={handleShareComplete} onBack={() => { window.location.hash = ''; setCurrentView('create'); }} addToast={addToast} topBar={topBarNavigation} />;
          case 'vote':
            return <VotingInterface key={`${eventId}-${isManager && getEvent(eventId)?.config?.votingOpened === false ? 'prepare' : 'vote'}`} eventId={eventId} userName={userName} onSetUserName={handleSetUserName} onComplete={handleVoteComplete} onViewResults={handleViewResults} addToast={addToast} topBar={topBarNavigation} onUserRegistered={handleUserRegistered} organizerPreparation={isManager && getEvent(eventId)?.config?.votingOpened === false} onPreparationComplete={handlePreparationComplete} />;
          case 'vote-success':
            return <VoteSuccessScreen onFollowResult={handleViewResults} registeredUser={registeredUser} onUserRegistered={handleUserRegistered} addToast={addToast} topBar={topBarNavigation} onGoHome={goHome} />;
          case 'results':
            return <ResultsScreen eventId={eventId} isManager={isManager} onBack={handleBackFromResults} addToast={addToast} topBar={topBarNavigation} />;
          case 'manage':
            return (
              <ManagerDashboard
                eventId={eventId}
                onViewResults={handleViewResults}
                onBack={goHome}
                onEditVote={() => { setCurrentView('vote'); if (eventId) setVoteHashFromInviteLink(eventId, true); }}
                addToast={addToast}
                topBar={topBarNavigation}
                onEventDeleted={goHome}
              />
            );
          default:
            return (
              <HomeScreen
                adminSession={adminSession}
                registeredUser={registeredUser}
                onCreate={openCreateFlow}
                onMyEvents={openMyEvents}
                onOrganizerLogin={openOrganizerLogin}
                onLogout={adminSession ? handleOrganizerLogout : handleRegisteredUserLogout}
                onGoHome={goHome}
              />
            );
        }
      };

      return (<><Toaster toasts={toasts} removeToast={removeToast} />{renderCurrentView()}</>);
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
