  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then((registration) => {
            console.log('[PWA] Service Worker registered:', registration.scope);
            registration.update().catch(() => {});
          })
          .catch((error) => {
            console.log('[PWA] Service Worker registration failed:', error);
          });
      });
    }
    
    // PWA Install Prompt
    let deferredPrompt;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    
    window.addEventListener('beforeinstallprompt', (e) => {
      console.log('[PWA] Install prompt available');
      e.preventDefault();
      deferredPrompt = e;
      showInstallPrompt();
    });
    
    function showInstallPrompt() {
      if (isStandalone) return;
      const dismissed = localStorage.getItem('pwa-prompt-dismissed');
      if (dismissed && Date.now() - parseInt(dismissed, 10) < 7 * 24 * 60 * 60 * 1000) return;
      
      const container = document.getElementById('pwa-prompt-container');
      if (!container) return;
      if (container.querySelector('.pwa-install-prompt')) return;
      
      // iOS uses a different install method
      if (isIOS) {
        showIOSInstallGuide();
        return;
      }
      
      const prompt = document.createElement('div');
      prompt.className = 'pwa-install-prompt';
      prompt.innerHTML = `
        <img src="icons/icon-72x72.png" alt="Consenso" class="w-12 h-12 rounded-xl">
        <div class="flex-1">
          <p class="font-semibold text-slate-900">Instalar Consenso</p>
          <p class="text-sm text-slate-500">Acesse rapidamente do seu dispositivo</p>
        </div>
        <button id="install-btn" type="button" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-colors">
          Instalar
        </button>
        <button id="dismiss-btn" type="button" aria-label="Fechar aviso de instalação" class="p-2 text-slate-400 hover:text-slate-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      `;
      
      container.appendChild(prompt);
      const installBtn = prompt.querySelector('#install-btn');
      const dismissBtn = prompt.querySelector('#dismiss-btn');
      
      installBtn?.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          console.log('[PWA] User choice:', outcome);
          deferredPrompt = null;
        }
        prompt.classList.add('hide');
        setTimeout(() => prompt.remove(), 300);
      });
      
      dismissBtn?.addEventListener('click', () => {
        prompt.classList.add('hide');
        setTimeout(() => prompt.remove(), 300);
        localStorage.setItem('pwa-prompt-dismissed', Date.now().toString());
      });
    }
    
    function showIOSInstallGuide() {
      const container = document.getElementById('ios-guide-container');
      if (!container || localStorage.getItem('ios-guide-shown')) return;
      
      const guide = document.createElement('div');
      guide.className = 'ios-install-guide';
      guide.innerHTML = `
        <div class="ios-install-content">
          <img src="icons/icon-152x152.png" alt="Consenso" class="w-20 h-20 mx-auto mb-4 rounded-2xl">
          <h2 class="text-xl font-bold text-slate-900 mb-2">Adicione à Tela Inicial</h2>
          <p class="text-slate-600 mb-6">Instale o Consenso para acesso rápido:</p>
          <div class="space-y-4 text-left bg-slate-50 p-4 rounded-xl mb-6">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">1</div>
              <span class="text-slate-700">Toque no botão <strong>Compartilhar</strong></span>
            </div>
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">2</div>
              <span class="text-slate-700">Role e toque em <strong>Adicionar à Tela de Início</strong></span>
            </div>
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">3</div>
              <span class="text-slate-700">Toque em <strong>Adicionar</strong></span>
            </div>
          </div>
          <button id="ios-close-btn" class="w-full py-3 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition-colors">
            Entendi
          </button>
        </div>
      `;
      
      container.appendChild(guide);
      
      document.getElementById('ios-close-btn').addEventListener('click', () => {
        guide.remove();
        localStorage.setItem('ios-guide-shown', 'true');
      });
    }
    
    // Show prompt after 3 seconds if not dismissed recently
    setTimeout(() => {
      if (isStandalone) return;
      
      const dismissed = localStorage.getItem('pwa-prompt-dismissed');
      if (dismissed && Date.now() - parseInt(dismissed) < 7 * 24 * 60 * 60 * 1000) return;
      
      if (deferredPrompt || isIOS) {
        showInstallPrompt();
      }
    }, 3000);
    
    // Listen for app installed event
    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App installed');
      deferredPrompt = null;
      const prompt = document.querySelector('.pwa-install-prompt');
      if (prompt) prompt.remove();
    });
  </script>

    const Toaster = ({ toasts, removeToast }) => (

    );

    const generateId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join('');
    const { parseLocalDate, formatLocalDate, rankConsensusSlots } = window.ConsensoCore;
    const formatDate = formatLocalDate;
    const asDisplayDate = (date) => typeof date === 'string' ? parseLocalDate(date) : date;
    const formatDisplayDate = (date) => asDisplayDate(date).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
    const formatDisplayDateFull = (date) => asDisplayDate(date).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
    
    const getDatesInRange = (start, end) => {
      const dates = [];
      let current = new Date(start);
      const endDate = new Date(end);
      while (current <= endDate) { dates.push(new Date(current)); current.setDate(current.getDate() + 1); }
      return dates;
    };
    
    const getDayName = (date) => date.toLocaleDateString('pt-BR', { weekday: 'short' });
    const getDayNumber = (date) => date.getDate();
    const getMonthName = (date) => date.toLocaleDateString('pt-BR', { month: 'short' });
    const getTimezoneDisplay = () => {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const offset = new Date().getTimezoneOffset();
      const sign = offset <= 0 ? '+' : '-';
      const hours = Math.floor(Math.abs(offset) / 60);
      return `GMT${sign}${hours} ${tz.split('/').pop().replace(/_/g, ' ')}`;
    };

    const HOUR_SLOTS = ['06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];
    const SHIFT_TIMES = { morning: 'Manhã (6h-12h)', afternoon: 'Tarde (12h-18h)', evening: 'Noite (18h-22h)' };
    const SEPARATOR_HOURS = ['11:00', '17:00'];
    const HOUR_PERIODS = {
      morning: { label: 'Manhã', hours: HOUR_SLOTS.filter((hour) => Number(hour.slice(0, 2)) < 12) },
      afternoon: { label: 'Tarde', hours: HOUR_SLOTS.filter((hour) => Number(hour.slice(0, 2)) >= 12 && Number(hour.slice(0, 2)) < 18) },
      evening: { label: 'Noite', hours: HOUR_SLOTS.filter((hour) => Number(hour.slice(0, 2)) >= 18) },
    };

    const STORAGE_KEY = 'consenso_events';
    const USER_KEY = 'consenso_user';
    const ADMIN_SESSION_KEY = 'consenso_admin_session';
    const REGISTERED_USER_KEY = 'consenso_registered_user';

    const getGoogleClientId = () => {
      try {
        const id = typeof window !== 'undefined' && window.CONSENSO_GOOGLE_CLIENT_ID;
        return id ? String(id).trim() : '';
      } catch { return ''; }
    };

    /** Carrega https://accounts.google.com/gsi/client uma vez; trata script já presente ou já carregado. */
    const loadGoogleIdentityScript = () => {
      if (typeof window === 'undefined') return Promise.reject(new Error('Sem window'));
      if (window.google?.accounts?.id) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const sel = 'script[data-consenso-gis="1"]';
        const existing = document.querySelector(sel);
        const finish = () => {
          if (window.google?.accounts?.id) resolve();
          else reject(new Error('Google Identity Services indisponível após carregar o script.'));
        };
        if (existing) {
          if (window.google?.accounts?.id) return finish();
          existing.addEventListener('load', finish);
          existing.addEventListener('error', () => reject(new Error('Erro ao carregar o script do Google.')));
          queueMicrotask(() => {
            if (window.google?.accounts?.id) finish();
          });
          return;
        }
        const s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.defer = true;
        s.setAttribute('data-consenso-gis', '1');
        s.onload = finish;
        s.onerror = () => reject(new Error('Erro ao carregar o script do Google.'));
        document.head.appendChild(s);
      });
    };

    const parseJwtPayload = (token) => {
      try {
        const part = token.split('.')[1];
        if (!part) return null;
        let base64 = part.replace(/-/g, '+').replace(/_/g, '/');
        const pad = base64.length % 4;
        if (pad) base64 += '='.repeat(4 - pad);
        const json = decodeURIComponent(atob(base64).split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(json);
      } catch { return null; }
    };

    const getAdminSession = () => {
      try {
        const s = localStorage.getItem(ADMIN_SESSION_KEY);
        return s ? JSON.parse(s) : null;
      } catch { return null; }
    };

    const setAdminSession = (session) => {
      localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(session));
    };

    const clearAdminSession = () => {
      localStorage.removeItem(ADMIN_SESSION_KEY);
    };

    const adminKey = (session) => {
      if (!session) return null;
      if (session.provider === 'google' && session.sub) return `google:${session.sub}`;
      if (session.provider === 'email' && session.email) return `email:${session.email.trim().toLowerCase()}`;
      return null;
    };

    const canManageEventId = (eventId) => {
      const event = getEvent(eventId);
      if (!event) return false;
      const session = getAdminSession();
      if (event.config.firebaseOwnerUid) return Boolean(session?.firebaseUid && session.firebaseUid === event.config.firebaseOwnerUid);
      const key = adminKey(session);
      if (key && event.config.creatorAdminKey === key) return true;
      if (!event.config.creatorAdminKey) {
        const u = getCurrentUser();
        return event.config.creatorId === u.id;
      }
      return false;
    };

    const getEventsForAdmin = () => {
      const session = getAdminSession();
      const key = adminKey(session);
      if (!key) return [];
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return Object.keys(events)
        .filter((id) => events[id].config.firebaseOwnerUid
          ? events[id].config.firebaseOwnerUid === session.firebaseUid
          : events[id].config.creatorAdminKey === key)
        .map((id) => ({ id, ...events[id] }))
        .sort((a, b) => new Date(b.config.createdAt) - new Date(a.config.createdAt));
    };
    
    const getCurrentUser = () => {
      const stored = localStorage.getItem(USER_KEY);
      if (stored) return JSON.parse(stored);
      const newUser = { id: generateId(), name: '', isAnonymous: true };
      localStorage.setItem(USER_KEY, JSON.stringify(newUser));
      return newUser;
    };
    
    const setUserName = (name) => {
      const user = getCurrentUser();
      user.name = name;
      localStorage.setItem(USER_KEY, JSON.stringify(user));
    };

    // ===== Novo: Sistema de Usuário Registrado =====
    const getRegisteredUser = () => {
      const stored = localStorage.getItem(REGISTERED_USER_KEY);
      return stored ? JSON.parse(stored) : null;
    };

    const registerUser = (email, name) => {
      const trimmedEmail = email.trim().toLowerCase();
      const user = {
        id: generateId(),
        email: trimmedEmail,
        name: name.trim(),
        registeredAt: new Date().toISOString(),
        isAnonymous: false
      };
      localStorage.setItem(REGISTERED_USER_KEY, JSON.stringify(user));
      return user;
    };

    const loginUser = (email) => {
      const trimmedEmail = email.trim().toLowerCase();
      const stored = localStorage.getItem(REGISTERED_USER_KEY);
      if (stored) {
        const user = JSON.parse(stored);
        if (user.email === trimmedEmail) {
          return user;
        }
      }
      return null;
    };

    const logoutUser = () => {
      localStorage.removeItem(REGISTERED_USER_KEY);
    };

    const trackParticipatedEvent = (eventId) => {
      if (!eventId) return;
      const participatedEvents = JSON.parse(localStorage.getItem(PARTICIPATED_EVENTS_KEY) || '[]');
      if (!participatedEvents.includes(eventId)) {
        participatedEvents.push(eventId);
        localStorage.setItem(PARTICIPATED_EVENTS_KEY, JSON.stringify(participatedEvents));
      }
    };

    const getParticipatedEvents = () => {
      const participatedEvents = JSON.parse(localStorage.getItem(PARTICIPATED_EVENTS_KEY) || '[]');
      return participatedEvents
        .map(eventId => {
          const event = getEvent(eventId);
          return event ? { id: eventId, ...event } : null;
        })
        .filter(Boolean)
        .sort((a, b) => new Date(b.config.createdAt) - new Date(a.config.createdAt));
    };

    const mergeAnonymousVoteToRegistered = (oldUserId, newUserId, eventId) => {
      const event = getEvent(eventId);
      if (!event) return;
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const eventData = events[eventId];
      if (!eventData) return;
      
      // Remove voto antigo (anônimo)
      eventData.votes = eventData.votes.filter(v => v.userId !== oldUserId);
      
      // Atualiza o voto para o novo usuário registrado
      const anonymousVote = event.votes.find(v => v.userId === oldUserId);
      if (anonymousVote) {
        eventData.votes.push({
          ...anonymousVote,
          userId: newUserId
        });
      }
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    };

    /** Mesmo appId que o Kanban em index.html (Funil de vendas). */
    const CONSENSO_FB_APP_ID = 'pepperhatapps';

    const consensoFirestoreReady = () => !!(typeof window !== 'undefined' && window.consensoDb && window.consensoFsDoc);

    const consensoPublicDataDocRef = () =>
      window.consensoFsDoc(window.consensoDb, 'artifacts', CONSENSO_FB_APP_ID, 'public', 'data');

    const consensoLookupDocRef = (eventId) => window.consensoFsDoc(consensoPublicDataDocRef(), 'consenso_lookup', eventId);

    const consensoEventDocRef = (ownerUid, eventId) =>
      window.consensoFsDoc(window.consensoDb, 'artifacts', CONSENSO_FB_APP_ID, 'users', ownerUid, 'consenso_v1', eventId);

    const consensoVotesColRef = (ownerUid, eventId) =>
      window.consensoFsCollection(consensoEventDocRef(ownerUid, eventId), 'votes');

    const consensoParticipantsColRef = (ownerUid, eventId) =>
      window.consensoFsCollection(consensoEventDocRef(ownerUid, eventId), 'participants');

    const consensoPublicCommentsColRef = (ownerUid, eventId) =>
      window.consensoFsCollection(consensoEventDocRef(ownerUid, eventId), 'public_comments');

    const consensoConfigToPlain = (c) => {
      const { creatorAdminKey, creatorAdminEmail, ...publicConfig } = c;
      return {
        ...publicConfig,
        startDate: c.startDate instanceof Date ? c.startDate.toISOString() : c.startDate,
        endDate: c.endDate instanceof Date ? c.endDate.toISOString() : c.endDate,
        createdAt: c.createdAt instanceof Date ? c.createdAt.toISOString() : c.createdAt,
      };
    };

    const consensoFsScalarToIso = (v) => {
      if (v == null) return v;
      if (typeof v === 'string') return v;
      if (v instanceof Date) return v.toISOString();
      if (typeof v.toDate === 'function') return v.toDate().toISOString();
      if (typeof v.seconds === 'number') return new Date(v.seconds * 1000).toISOString();
      return String(v);
    };

    const consensoConfigFromFs = (c) => {
      if (!c || typeof c !== 'object') return c;
      return {
        ...c,
        startDate: consensoFsScalarToIso(c.startDate),
        endDate: consensoFsScalarToIso(c.endDate),
        createdAt: consensoFsScalarToIso(c.createdAt),
      };
    };

    const consensoCloudWriteNewEvent = async (ownerUid, newConfig) => {
      if (!consensoFirestoreReady() || !ownerUid) return;
      const eventId = newConfig.id;
      const batch = window.consensoFsWriteBatch(window.consensoDb);
      const cfg = consensoConfigToPlain({ ...newConfig, firebaseOwnerUid: ownerUid });
      batch.set(consensoLookupDocRef(eventId), { ownerUid, updatedAt: new Date().toISOString() });
      batch.set(consensoEventDocRef(ownerUid, eventId), {
        config: cfg,
        updatedAt: new Date().toISOString(),
      });
      await batch.commit();
    };

    const consensoCloudPushVote = async (ownerUid, eventId, vote) => {
      if (!consensoFirestoreReady() || !ownerUid) return;
      const vref = window.consensoFsDoc(
        window.consensoDb,
        'artifacts',
        CONSENSO_FB_APP_ID,
        'users',
        ownerUid,
        'consenso_v1',
        eventId,
        'votes',
        vote.userId
      );
      const pref = window.consensoFsDoc(
        window.consensoDb,
        'artifacts',
        CONSENSO_FB_APP_ID,
        'users',
        ownerUid,
        'consenso_v1',
        eventId,
        'participants',
        vote.userId
      );
      const voteData = {
        userId: vote.userId,
        userName: vote.userName,
        ...(vote.notificationEmail ? { notificationEmail: vote.notificationEmail } : {}),
        ...(Array.isArray(vote.requiredInfoAnswers) ? { requiredInfoAnswers: vote.requiredInfoAnswers } : {}),
        ...(typeof vote.requiredInfo === 'string' ? { requiredInfo: vote.requiredInfo } : {}),
        timeSlots: vote.timeSlots,
        preferredSlots: vote.preferredSlots || [],
        comment: vote.comment || '',
        commentVisibility: vote.commentVisibility || 'organizer',
        votedAt: typeof vote.votedAt === 'string' ? vote.votedAt : new Date(vote.votedAt).toISOString(),
      };
      await window.consensoFsSetDoc(vref, voteData);
      try {
        await window.consensoFsSetDoc(pref, {
        userId: vote.userId,
        votedAt: typeof vote.votedAt === 'string' ? vote.votedAt : new Date(vote.votedAt).toISOString(),
        });
      } catch (receiptError) {
        console.error('[Consenso] Voto salvo, mas o recibo de contagem falhou', receiptError);
      }
      const cref = window.consensoFsDoc(consensoPublicCommentsColRef(ownerUid, eventId), vote.userId);
      try {
        if (vote.comment && vote.commentVisibility === 'everyone') {
          await window.consensoFsSetDoc(cref, {
            userId: vote.userId,
            userName: vote.userName,
            comment: vote.comment,
            votedAt: typeof vote.votedAt === 'string' ? vote.votedAt : new Date(vote.votedAt).toISOString(),
          });
        } else if (vote.removePublicComment) {
          await window.consensoFsDeleteDoc(cref);
        }
      } catch (commentError) {
        console.error('[Consenso] Voto salvo, mas a sincronização do comentário público falhou', commentError);
      }
    };

    const consensoCloudMergeConfig = async (ownerUid, eventId, partial) => {
      if (!consensoFirestoreReady() || !ownerUid) return;
      const ref = consensoEventDocRef(ownerUid, eventId);
      const snap = await window.consensoFsGetDoc(ref);
      if (!snap.exists()) return;
      const prev = consensoConfigFromFs(snap.data().config || {});
      const next = { ...prev, ...partial };
      await window.consensoFsSetDoc(ref, { config: consensoConfigToPlain(next), updatedAt: new Date().toISOString() }, { merge: true });
    };

    const activateEventVoting = async (eventId, blockedSlots) => {
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const event = events[eventId];
      if (!event) throw new Error('Reunião não encontrada');
      const partial = { votingOpened: true, blockedSlots: Array.from(new Set(blockedSlots || [])), openedAt: new Date().toISOString() };
      const owner = event.config?.firebaseOwnerUid;
      if (owner && consensoFirestoreReady()) await consensoCloudMergeConfig(owner, eventId, partial);
      event.config = { ...event.config, ...partial };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return getEvent(eventId);
    };
    
    const createEvent = async (config) => {
      if (config.requiredInfoLabels !== undefined && (!Array.isArray(config.requiredInfoLabels) || config.requiredInfoLabels.length > 4 || config.requiredInfoLabels.some((label) => typeof label !== 'string' || !label.trim() || label.length > 80))) throw new Error('Defina até 4 informações com títulos de até 80 caracteres.');
      const admin = getAdminSession();
      const ak = adminKey(admin);
      if (!ak) throw new Error('Organizador não autenticado');
      if (!admin?.firebaseUid) throw new Error('Entre com Google para salvar a reunião na sua conta e acessá-la em outros aparelhos.');
      if (!consensoFirestoreReady()) throw new Error('A sincronização está indisponível. A reunião ainda não foi criada. Tente novamente com conexão.');
      if ((config.emailMode && config.emailMode !== 'none' || config.votingDeadline) && !admin?.firebaseUid) throw new Error('Entre com Google para usar prazo automático ou e-mail.');
      if (config.meetingInstructions && (typeof config.meetingInstructions !== 'string' || config.meetingInstructions.length > 2000)) throw new Error('As orientações devem ter até 2000 caracteres.');
      if (config.votingDeadline && (!Number.isFinite(new Date(config.votingDeadline).getTime()) || new Date(config.votingDeadline).getTime() <= Date.now())) throw new Error('Escolha um prazo futuro.');
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const newConfig = {
        ...config,
        id: generateId(),
        createdAt: new Date().toISOString(),
        resultsUnlocked: false,
        finalized: false,
        votingOpened: false,
        blockedSlots: [],
        creatorAdminKey: ak || undefined,
        creatorAdminEmail: admin?.email || undefined,
        ...(admin?.firebaseUid ? { firebaseOwnerUid: admin.firebaseUid } : {}),
      };
      if (admin?.firebaseUid && consensoFirestoreReady()) {
        await waitForConsensoFirebaseUser(admin.firebaseUid);
        await consensoCloudWriteNewEvent(admin.firebaseUid, newConfig);
      }
      events[newConfig.id] = { config: newConfig, votes: [] };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return newConfig;
    };
    
    const getEvent = (eventId) => {
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const event = events[eventId];
      if (!event) return null;
      return {
        config: { ...event.config, startDate: new Date(event.config.startDate), endDate: new Date(event.config.endDate), createdAt: new Date(event.config.createdAt) },
        votes: event.votes.map(v => ({ ...v, votedAt: new Date(v.votedAt) })),
        organizerSummary: event.organizerSummary || null
      };
    };
    
    const getRequiredInfoLabels = (config) => {
      return Array.isArray(config.requiredInfoLabels) ? config.requiredInfoLabels.slice(0, 4) : (config.requiredInfoLabel ? [config.requiredInfoLabel] : []);
    };
    const getRequiredInfoAnswers = (vote) => {
      return Array.isArray(vote.requiredInfoAnswers) ? vote.requiredInfoAnswers : (vote.requiredInfo ? [vote.requiredInfo] : []);
    };

    const normalizeFullName = (value) => {
      return typeof value === 'string' ? value.trim().replace(/\s+/g, ' ') : '';
    };
    const isValidFullName = (value) => {
      const name = normalizeFullName(value);
      return name.length <= 120 && /^[\p{L}\p{M}][\p{L}\p{M}’'.-]*( [\p{L}\p{M}][\p{L}\p{M}’'.-]*)+$/u.test(name);
    };

    const submitVote = async (eventId, vote) => {
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const event = events[eventId];
      if (!event) throw new Error('Event not found');
      if (!isValidFullName(vote.userName)) throw new Error('Informe seu nome completo (nome e sobrenome), com até 120 caracteres.');
      vote = { ...vote, userName: normalizeFullName(vote.userName) };
      if (isVotingClosed(event.config) || event.config.votingOpened === false) throw new Error('A votação não está aberta.');
      if ((vote.timeSlots || []).some((slot) => (event.config.blockedSlots || []).includes(slot))) throw new Error('O voto contém horários bloqueados.');
      if (event.config.firebaseOwnerUid && !consensoFirestoreReady()) throw new Error('A sincronização está indisponível. Tente novamente com conexão.');
      const notificationEmail = String(vote.notificationEmail || '').trim();
      if (event.config.emailMode === 'required' && !notificationEmail) throw new Error('Informe seu e-mail para receber o resultado.');
      if (notificationEmail && !isValidNotificationEmail(notificationEmail)) throw new Error('Informe um e-mail válido.');
      if (vote.requiredInfoAnswers !== undefined && !Array.isArray(vote.requiredInfoAnswers)) throw new Error('Respostas inválidas.');
      const labels = getRequiredInfoLabels(event.config);
      const answers = getRequiredInfoAnswers(vote);
      if (Array.isArray(event.config.requiredInfoLabels) && answers.length > labels.length) throw new Error('As respostas não correspondem aos campos solicitados.');
      if (answers.length > 4 || answers.some((answer) => typeof answer !== 'string' || answer.length > 300)) throw new Error('Informe até 4 respostas com até 300 caracteres.');
      const missing = labels.findIndex((label, index) => !answers[index]?.trim());
      if (missing >= 0) throw new Error(`Informe ${labels[missing]} para votar.`);
      if (vote.requiredInfo !== undefined && (typeof vote.requiredInfo !== 'string' || vote.requiredInfo.length > 300)) throw new Error('A informação adicional deve ter até 300 caracteres.');
      const votedAt = new Date().toISOString();
      const { removePublicComment, ...storedVote } = vote;
      const owner = event.config?.firebaseOwnerUid;
      if (owner && consensoFirestoreReady()) {
        await consensoCloudPushVote(owner, eventId, { ...vote, votedAt });
      }
      event.votes = event.votes.filter(v => v.userId !== vote.userId);
      event.votes.push({ ...storedVote, votedAt });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    };
    
    const hasUserVoted = (eventId, userId) => {
      const event = getEvent(eventId);
      return event ? event.votes.some(v => v.userId === userId) : false;
    };
    
    const getUserVote = (eventId, userId) => {
      const event = getEvent(eventId);
      return event ? event.votes.find(v => v.userId === userId) || null : null;
    };
    
    const refreshCloudEventAfterAction = async (ownerUid, eventId) => {
      const ref = consensoEventDocRef(ownerUid, eventId);
      const snap = await window.consensoFsGetDoc(ref);
      if (!snap.exists()) throw new Error('Reunião não encontrada.');
      const config = consensoConfigFromFs(snap.data().config);
      let organizerSummary = null;
      if (config.tallyOpenedAt) { const summary = await window.consensoFsGetDoc(window.consensoFsDoc(ref, 'organizer_results', 'summary')); if (summary.exists()) organizerSummary = summary.data(); }
      mergeHydratedEvent(eventId, { config, votes: [], organizerSummary });
      return getEvent(eventId);
    };
    const openEventTally = async (eventId, earlyConfirmed) => {
      const event = getEvent(eventId);
      if (!event || !canManageEventId(eventId)) throw new Error('Acesso restrito ao organizador.');
      if (event.config.firebaseOwnerUid) {
        await waitForConsensoFirebaseUser(event.config.firebaseOwnerUid);
        await window.consensoCall('consensoOpenTally', { ownerUid: event.config.firebaseOwnerUid, eventId, earlyConfirmed });
        return refreshCloudEventAfterAction(event.config.firebaseOwnerUid, eventId);
      }
      if (isVotingClosed(event.config) || !event.votes.length) throw new Error('A votação não pode ser aberta para apuração agora.');
      const early = !hasStrictMajority(event);
      if (early && !earlyConfirmed) throw new Error('Confirme a antecipação.');
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      events[eventId].config = { ...events[eventId].config, votingClosed: true, tallyOpenedAt: new Date().toISOString(), tallyEarly: early };
      events[eventId].organizerSummary = { slots: rankConsensusSlots(event).map((slot) => ({ ...slot, date: formatDate(slot.date) })), totalVotes: event.votes.length };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return getEvent(eventId);
    };
    const unlockResults = async (eventId, selectedSlotKey) => {
      const event = getEvent(eventId);
      if (!event || !canManageEventId(eventId)) throw new Error('Acesso restrito ao organizador.');
      if (!canChooseFinalResult(event)) throw new Error('Abra a apuração antes de escolher o resultado.');
      if (event.config.firebaseOwnerUid) {
        await waitForConsensoFirebaseUser(event.config.firebaseOwnerUid);
        await window.consensoCall('consensoFinalize', { ownerUid: event.config.firebaseOwnerUid, eventId, selectedSlotKey });
        return refreshCloudEventAfterAction(event.config.firebaseOwnerUid, eventId);
      }
      const chosen = rankConsensusSlots(event).find((slot) => slot.key === selectedSlotKey);
      if (!chosen) throw new Error('Selecione uma opção válida do consenso.');
      const finalResult = { type: chosen.votes === event.votes.length ? 'unanimous' : 'majority', slots: [{ ...chosen, date: formatDate(chosen.date) }], totalVotes: event.votes.length, quorum: event.config.quorum };
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      events[eventId].config = { ...events[eventId].config, finalized: true, resultsUnlocked: true, votingClosed: true, finalizedAt: new Date().toISOString(), finalResult, selectedFinalSlot: selectedSlotKey };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    };

    /** Exclui reunião: primeiro Firestore (se houver), depois localStorage — assim não apagamos o local se a nuvem falhar. */
    const deleteEventForOrganizer = async (eventId) => {
      if (!canManageEventId(eventId)) {
        throw new Error('Sem permissão para excluir esta reunião.');
      }
      const ev = getEvent(eventId);
      if (!ev) return;
      const ownerUid = ev?.config?.firebaseOwnerUid;
      const session = getAdminSession();

      if (ownerUid && session?.firebaseUid === ownerUid && consensoFirestoreReady() && window.consensoFsDeleteDoc) {
        try {
          await waitForConsensoFirebaseUser(ownerUid);
          await window.consensoCall('consensoDeleteEvent', { ownerUid, eventId });
        } catch (e) {
          console.error('[Consenso] Firestore delete', e);
          throw new Error('Não foi possível excluir na nuvem. Verifique a conexão e tente de novo.');
        }
      }

      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      delete events[eventId];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    };
    
    const getVotedUserNames = (eventId) => {
      const event = getEvent(eventId);
      return event ? event.votes.map(v => v.userName).filter(Boolean) : [];
    };

    /** Serializa evento para JSON (datas em ISO) — usado no link do convite. */
    const eventSnapshotToJSON = (eventData) => window.ConsensoCore.sanitizeInvitePayload(eventData);

    const isoVote = (d) => {
      if (!d) return new Date().toISOString();
      if (typeof d === 'string') return d;
      if (d instanceof Date) return d.toISOString();
      return new Date(d).toISOString();
    };

    /** Grava no localStorage dados confiáveis da reunião. Votos só entram por leitura autenticada da nuvem. */
    const mergeHydratedEvent = (eventId, payload, { replaceVotes = false } = {}) => {
      if (!payload?.config || String(payload.config.id) !== String(eventId)) return false;
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const cfg = {
        ...payload.config,
        id: eventId,
        startDate: typeof payload.config.startDate === 'string' ? payload.config.startDate : isoVote(payload.config.startDate),
        endDate: typeof payload.config.endDate === 'string' ? payload.config.endDate : isoVote(payload.config.endDate),
        createdAt: typeof payload.config.createdAt === 'string' ? payload.config.createdAt : isoVote(payload.config.createdAt),
      };
      const incomingVotes = (payload.votes || []).map((v) => ({ ...v, votedAt: isoVote(v.votedAt) }));

      if (!events[eventId]) {
        events[eventId] = { config: cfg, votes: incomingVotes, publicComments: payload.publicComments || [], organizerSummary: payload.organizerSummary || null };
      } else {
        const byUser = new Map();
        [...(replaceVotes ? [] : (events[eventId].votes || [])), ...incomingVotes].forEach((v) => {
          const prev = byUser.get(v.userId);
          if (!prev || new Date(v.votedAt) > new Date(prev.votedAt)) byUser.set(v.userId, v);
        });
        events[eventId] = {
          config: { ...events[eventId].config, ...cfg },
          votes: Array.from(byUser.values()),
          publicComments: payload.publicComments || events[eventId].publicComments || [],
          organizerSummary: Object.prototype.hasOwnProperty.call(payload, 'organizerSummary') ? payload.organizerSummary : events[eventId].organizerSummary || null,
        };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      return true;
    };

    const ensureConsensoGuestFirebase = async () => {
      for (let attempt = 0; !window.consensoFirebaseAuthReady && attempt < 100; attempt++) {
        await new Promise((resolve) => setTimeout(resolve, 80));
      }
      if (!window.consensoFirebaseAuthReady) throw new Error('A autenticação não carregou. Atualize a página e tente novamente.');
      let authTimeout;
      try {
        await Promise.race([
          window.consensoFirebaseAuthReady,
          new Promise((_, reject) => { authTimeout = setTimeout(() => reject(new Error('A autenticação demorou para responder. Tente novamente.')), 8000); }),
        ]);
      } finally { clearTimeout(authTimeout); }
      if (window.consensoFirebaseUser?.uid) return window.consensoFirebaseUser;
      const credential = await window.consensoSignInAnonymously();
      if (!credential?.user?.uid) throw new Error('Não foi possível autenticar sua participação.');
      window.consensoFirebaseUser = credential.user;
      return credential.user;
    };

    const waitForConsensoFirebaseUser = async (expectedUid, timeoutMs = 8000) => {
      if (!expectedUid) return null;
      if (window.consensoFirebaseUser?.uid === expectedUid) return window.consensoFirebaseUser;
      if (window.consensoFirebaseUser?.uid && window.consensoFirebaseUser.uid !== expectedUid) {
        throw new Error('A conta Firebase ativa é diferente da conta do organizador. Saia e entre novamente.');
      }
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          window.removeEventListener('consenso-firebase-auth', onAuth);
          reject(new Error('A autenticação do Firebase não ficou pronta. Saia e entre novamente como organizador.'));
        }, timeoutMs);
        const onAuth = (event) => {
          const user = event.detail;
          if (!user) return;
          if (user.uid !== expectedUid) {
            clearTimeout(timeout);
            window.removeEventListener('consenso-firebase-auth', onAuth);
            reject(new Error('A conta Firebase ativa é diferente da conta do organizador. Saia e entre novamente.'));
            return;
          }
          clearTimeout(timeout);
          window.removeEventListener('consenso-firebase-auth', onAuth);
          resolve(user);
        };
        window.addEventListener('consenso-firebase-auth', onAuth);
      });
    };

    const consensoFetchLookupOwnerUid = async (eventId) => {
      if (!consensoFirestoreReady()) return null;
      try {
        const snap = await window.consensoFsGetDoc(consensoLookupDocRef(eventId));
        if (!snap.exists()) return null;
        const o = snap.data()?.ownerUid;
        return o ? String(o) : null;
      } catch (e) {
        console.error('[Consenso] lookup', e);
        return null;
      }
    };

    const consensoSubscribeRemoteEvent = (ownerUid, eventId, onMerged, onError) => {
      if (!consensoFirestoreReady()) return () => {};
      const ref = consensoEventDocRef(ownerUid, eventId);
      const currentUid = window.consensoFirebaseUser?.uid;
      const isOwner = currentUid === ownerUid;
      let cfg = null, ownVote = null, details = [], participantCount = 0, publicComments = [], organizerSummary = null;
      let summaryUnsub = null;
      const flush = () => {
        if (!cfg) return;
        const votes = isOwner ? details.filter((vote) => vote.userId !== currentUid) : [];
        if (ownVote) votes.push(ownVote);
        else if (isOwner) { const mine = details.find((vote) => vote.userId === currentUid); if (mine) votes.push(mine); }
        const hadLocal = !!getEvent(eventId);
        mergeHydratedEvent(eventId, { config: { ...consensoConfigFromFs(cfg), voteCount: participantCount }, votes, publicComments, organizerSummary }, { replaceVotes: true });
        if (onMerged) onMerged();
        if (!hadLocal) window.dispatchEvent(new CustomEvent('consenso-remote-hydrated', { detail: { eventId } }));
      };
      const report = (error) => { console.error('[Consenso] Sincronização indisponível', error); if (onError) onError(error); };
      const unsubscribers = [];
      unsubscribers.push(window.consensoFsOnSnapshot(ref, (snap) => {
        if (!snap.exists()) return;
        cfg = snap.data().config;
        if (isOwner && cfg.tallyOpenedAt && !summaryUnsub) summaryUnsub = window.consensoFsOnSnapshot(window.consensoFsDoc(ref, 'organizer_results', 'summary'), (summary) => { organizerSummary = summary.exists() ? summary.data() : null; flush(); }, report);
        flush();
      }, report));
      if (currentUid) unsubscribers.push(window.consensoFsOnSnapshot(window.consensoFsDoc(consensoVotesColRef(ownerUid, eventId), currentUid), (snap) => { ownVote = snap.exists() ? snap.data() : null; flush(); }, report));
      if (isOwner) unsubscribers.push(window.consensoFsOnSnapshot(window.consensoFsCollection(ref, 'participant_details'), (snap) => { details = snap.docs.map((doc) => ({ ...doc.data(), timeSlots: [], preferredSlots: [] })); flush(); }, report));
      unsubscribers.push(window.consensoFsOnSnapshot(consensoParticipantsColRef(ownerUid, eventId), (snap) => { participantCount = snap.size; flush(); }, report));
      unsubscribers.push(window.consensoFsOnSnapshot(consensoPublicCommentsColRef(ownerUid, eventId), (snap) => { publicComments = snap.docs.map((doc) => doc.data()); flush(); }, report));
      return () => { unsubscribers.forEach((unsubscribe) => unsubscribe()); if (summaryUnsub) summaryUnsub(); };
    };

    const consensoApplyOrganizerSnapshot = (uid, snap) => {
      if (getAdminSession()?.firebaseUid !== uid) return;
      const events = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      const remoteIds = new Set(snap.docs.map(d => d.id));
      // Uma resposta somente do cache/offline não comprova exclusão no servidor.
      if (!snap.metadata?.fromCache) {
        for (const [id, event] of Object.entries(events)) {
          if (event.config.firebaseOwnerUid === uid && !remoteIds.has(id)) delete events[id];
        }
      }
      for (const d of snap.docs) {
        const cfg = consensoConfigFromFs(d.data().config || {});
        events[d.id] = {
          ...events[d.id],
          config: { ...events[d.id]?.config, ...cfg, id: d.id, firebaseOwnerUid: uid },
          votes: events[d.id]?.votes || []
        };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    };

    const consensoSubscribeOrganizerEvents = async (uid, onChange, onError) => {
      await waitForConsensoFirebaseUser(uid);
      if (getAdminSession()?.firebaseUid !== uid) return () => {};
      const col = window.consensoFsCollection(
        window.consensoFsDoc(window.consensoDb, 'artifacts', CONSENSO_FB_APP_ID, 'users', uid), 'consenso_v1'
      );
      return window.consensoFsOnSnapshot(col, { includeMetadataChanges: true }, (snap) => {
        if (getAdminSession()?.firebaseUid !== uid) return;
        try { consensoApplyOrganizerSnapshot(uid, snap); onChange(snap.metadata?.fromCache ? 'cached' : 'synced'); }
        catch (error) { onError(error); }
      }, onError);
    };

    const consensoHydrateOrganizerEvent = async (uid, eventId) => {
      await waitForConsensoFirebaseUser(uid);
      if (getAdminSession()?.firebaseUid !== uid) return false;
      const snap = await window.consensoFsGetDoc(consensoEventDocRef(uid, eventId));
      if (!snap.exists() || getAdminSession()?.firebaseUid !== uid) return false;
      mergeHydratedEvent(eventId, { config: { ...consensoConfigFromFs(snap.data().config), id: eventId, firebaseOwnerUid: uid } });
      return true;
    };

    /** Convidado em reunião na nuvem usa o uid do Firebase (anônimo), para bater com as regras do Firestore. */
    const getConsensoVoterUser = (eventId) => {
      const local = getCurrentUser();
      const ev = getEvent(eventId);
      const fb = window.consensoFirebaseUser;
      if (ev?.config?.firebaseOwnerUid && fb?.uid) {
        return { id: fb.uid, name: local.name || '', isAnonymous: !!fb.isAnonymous };
      }
      return getRegisteredUser() || local;
    };

    /** Lê ?d= da hash #event/ID ou #manage/ID e repõe a reunião no storage. */
    const tryHydrateEventFromInviteHash = () => {
      if (typeof window === 'undefined' || typeof LZString === 'undefined') return;
      const raw = window.location.hash.replace(/^#/, '');
      const isEventRoute = raw.startsWith('event/');
      const isManageRoute = raw.startsWith('manage/');
      if (!isEventRoute && !isManageRoute) return;
      const qIdx = raw.indexOf('?');
      const path = qIdx >= 0 ? raw.slice(0, qIdx) : raw;
      const id = isEventRoute ? path.slice(6) : path.slice(7);
      if (!id) return;
      const params = new URLSearchParams(qIdx >= 0 ? raw.slice(qIdx + 1) : '');
      const d = params.get('d');
      if (!d) return;
      try {
        const json = LZString.decompressFromEncodedURIComponent(d);
        if (!json) return;
        const payload = JSON.parse(json);
        // Links antigos podiam conter votos. Nunca os importe da URL.
        mergeHydratedEvent(id, { config: payload.config, votes: [] }, { replaceVotes: true });
      } catch (e) {
        console.error('[Consenso] Link de convite inválido:', e);
      }
    };

    /**
     * Link para convidados: com Firestore + login Google do organizador, link curto (#event/id).
     * Sem nuvem, mantém ?d= compactado (LZString) para outro aparelho.
     */
    const buildInviteLink = (eventId) => {
      const base = `${window.location.origin}${window.location.pathname}`;
      const ev = getEvent(eventId);
      if (ev?.config?.firebaseOwnerUid && consensoFirestoreReady()) {
        return `${base}#event/${eventId}`;
      }
      if (!ev || typeof LZString === 'undefined') return `${base}#event/${eventId}`;
      try {
        const snap = eventSnapshotToJSON(ev);
        const json = JSON.stringify(snap);
        const compressed = LZString.compressToEncodedURIComponent(json);
        if (!compressed) return `${base}#event/${eventId}`;
        return `${base}#event/${eventId}?d=${compressed}`;
      } catch (e) {
        console.error('[Consenso] buildInviteLink', e);
        return `${base}#event/${eventId}`;
      }
    };

    /** Mesma mensagem para WhatsApp e “Copiar texto”; URL sozinha na última linha (melhor para apps não cortarem o link). */
    const buildGuestInviteShareMessage = (eventTitle, eventLink) =>
      `Oi! 📅\n\nEstou organizando "${eventTitle}" no Consenso.\n\nSuas escolhas não são mostradas aos outros participantes; apenas o resultado agregado é exibido.\n\nVote aqui:\n${eventLink}`;

    /** Atualiza só a parte da hash após # com o link completo do convite (inclui ?d=). Adiciona ?voter se o organizador está votando. */
    const setVoteHashFromInviteLink = (eventId, isOrganizerVoting = false) => {
      const full = buildInviteLink(eventId);
      const i = full.indexOf('#');
      let hash = i >= 0 ? full.slice(i + 1) : `event/${eventId}`;
      if (isOrganizerVoting && !hash.includes('?')) {
        hash += '?voter';
      } else if (isOrganizerVoting && !hash.includes('voter')) {
        hash += '&voter';
      }
      window.location.hash = hash;
    };

    const {
      hasStrictMajority, isVotingClosed, canChooseFinalResult, isValidNotificationEmail, chooseAutomaticResult,
      calculateConsensus,
      canRevealResults,
      hasReachedQuorum,
      hasReachedEarlyRevelationThreshold,
      getMissingVotesCount,
      getVoteCount,
      getVoteProgressPercentage
    } = window.ConsensoCore;

    const canViewResults = canRevealResults;

    const generateICalContent = (event) => {
      const formatDate = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      return `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Consenso//EN\nBEGIN:VEVENT\nUID:${Date.now()}@consenso.app\nDTSTAMP:${formatDate(new Date())}\nDTSTART:${formatDate(event.startDate)}\nDTEND:${formatDate(event.endDate)}\nSUMMARY:${event.title}\nDESCRIPTION:${event.description || 'Reunião via Consenso'}\nEND:VEVENT\nEND:VCALENDAR`;
    };
    
    const downloadICal = (event) => {
      const content = generateICalContent(event);
      const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `consenso-${event.title.toLowerCase().replace(/\s+/g, '-')}.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    };
    
    const openGoogleCalendar = (event) => {
      const formatDate = (d) => d.toISOString().replace(/[-:]/g, '').split('.')[0];
      const params = new URLSearchParams({ action: 'TEMPLATE', text: event.title, dates: `${formatDate(event.startDate)}/${formatDate(event.endDate)}`, details: event.description || 'Reunião via Consenso' });
      window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, '_blank');
    };
    
    const parseTimeSlot = (slotKey, title) => {
      const [dateStr, timeStr] = slotKey.split('|');
      const date = parseLocalDate(dateStr);
      
      if (timeStr === 'morning') {
        const start = new Date(date); start.setHours(6, 0, 0, 0);
        const end = new Date(date); end.setHours(12, 0, 0, 0);
        return { title, startDate: start, endDate: end };
      } else if (timeStr === 'afternoon') {
        const start = new Date(date); start.setHours(12, 0, 0, 0);
        const end = new Date(date); end.setHours(18, 0, 0, 0);
        return { title, startDate: start, endDate: end };
      } else if (timeStr === 'evening') {
        const start = new Date(date); start.setHours(18, 0, 0, 0);
        const end = new Date(date); end.setHours(22, 0, 0, 0);
        return { title, startDate: start, endDate: end };
      } else if (timeStr.includes(':')) {
        const [hours, minutes] = timeStr.split(':').map(Number);
        const start = new Date(date); start.setHours(hours, minutes, 0, 0);
        const end = new Date(date); end.setHours(hours + 1, minutes, 0, 0);
        return { title, startDate: start, endDate: end };
      }
      return null;
    };

    const generateReminderMessage = (eventTitle, missingCount, eventLink, totalQuorum) => {
      const votedCount = totalQuorum - missingCount;
      const progressPercent = Math.round((votedCount / totalQuorum) * 100);
      return `Oi! 👋\n\nFaltam apenas ${missingCount} pessoa${missingCount > 1 ? 's' : ''} para fecharmos o horário da reunião "${eventTitle}".\n\nProgresso: ${votedCount}/${totalQuorum} (${progressPercent}%)\n\nSuas escolhas não são exibidas aos outros participantes.\n\nVote aqui: ${eventLink}\n\nObrigado! 🗓️`;
    };

    const Button = ({ children, onClick, variant = 'primary', size = 'md', disabled, className = '', type = 'button' }) => {
      const baseStyles = 'inline-flex items-center justify-center font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2';

    const Input = React.forwardRef(({ value, onChange, placeholder, type = 'text', className = '', min, max, id, ...props }, ref) => (

        className={`w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all ${className}`} />
    ));

    const Switch = ({ checked, onCheckedChange, id }) => (

        className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${checked ? 'bg-blue-600' : 'bg-slate-300'}`}>

    /**

        <div className="max-w-7xl mx-auto px-3 sm:px-4 min-h-14 flex flex-wrap items-center justify-between gap-y-2 gap-x-2 py-1.5">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0 flex-1">

    const AdminLoginScreen = ({ onSuccess, onCancel }) => {
      const [email, setEmail] = useState('');
      const [gisError, setGisError] = useState('');
      const googleBtnRef = useRef(null);
      const onSuccessRef = useRef(onSuccess);
      const cancelledRef = useRef(false);
      useEffect(() => { onSuccessRef.current = onSuccess; }, [onSuccess]);

      const googleClientId = getGoogleClientId();

      useLayoutEffect(() => {
        cancelledRef.current = false;
        setGisError('');
        const cid = getGoogleClientId();
        if (!cid) return undefined;

        const mountButton = (allowRetry) => {
          const el = googleBtnRef.current;
          if (cancelledRef.current || !window.google?.accounts?.id) return;
          if (!el) {
            if (allowRetry !== false) setTimeout(() => mountButton(false), 0);
            return;
          }
          try {
            window.google.accounts.id.initialize({
              client_id: cid,
              ux_mode: 'popup',
              auto_select: false,
              callback: async (response) => {
                if (cancelledRef.current) return;
                if (!response?.credential) {
                  setGisError('Não foi possível obter o token do Google. Tente de novo.');
                  return;
                }
                const payload = parseJwtPayload(response.credential);
                if (!payload?.email || !payload?.sub) {
                  setGisError('Resposta do Google inválida. Verifique o Client ID e as origens autorizadas.');
                  return;
                }
                setGisError('');
                const baseSession = {
                  provider: 'google',
                  email: payload.email,
                  name: payload.name || '',
                  picture: payload.picture || '',
                  sub: payload.sub,
                };
                try {
                  if (!window.linkConsensoFirebaseWithGoogleJwt) throw new Error('Autenticação indisponível.');
                  const cred = await window.linkConsensoFirebaseWithGoogleJwt(response.credential);
                  setAdminSession({ ...baseSession, firebaseUid: cred.user.uid });
                  if (!cancelledRef.current) onSuccessRef.current();
                } catch (err) {
                  console.error('[Consenso] Firebase Auth (Google):', err);
                  if (!cancelledRef.current) setGisError('Não foi possível entrar na sua conta. Verifique a conexão e tente novamente.');
                }
              }
            });
            el.innerHTML = '';
            const w = Math.min(320, typeof window !== 'undefined' ? Math.max(260, window.innerWidth - 48) : 320);
            window.google.accounts.id.renderButton(el, {
              type: 'standard',
              theme: 'outline',
              size: 'large',
              text: 'continue_with',
              width: w,
              locale: 'pt-BR'
            });
          } catch (err) {
            console.error('[Consenso] Google Sign-In:', err);
            setGisError(err?.message || 'Erro ao iniciar o login com Google.');
          }
        };

        const runAfterPaint = setTimeout(() => {
          loadGoogleIdentityScript()
            .then(() => {
              if (cancelledRef.current) return;
              mountButton(true);
            })
            .catch((err) => {
              console.error('[Consenso] GIS:', err);
              if (!cancelledRef.current) setGisError(err?.message || 'Falha ao carregar o Google.');
            });
        }, 0);

        return () => {
          cancelledRef.current = true;
          clearTimeout(runAfterPaint);
          if (googleBtnRef.current) googleBtnRef.current.innerHTML = '';
        };
      }, [googleClientId]);

      const handleEmailLogin = (e) => {
        e.preventDefault();
        const trimmed = email.trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) return;
        setAdminSession({ provider: 'email', email: trimmed, name: '' });
        onSuccess();
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">

          </header>

            <Card className="w-full max-w-md p-8">

        if (mode !== 'google' || gisLoadedRef.current) return;
        gisLoadedRef.current = true;

        const cid = getGoogleClientId();
        if (!cid) return;

        const mountButton = (retry) => {
          const el = googleBtnRef.current;
          if (!window.google?.accounts?.id || !el) {
            if (retry !== false) setTimeout(() => mountButton(false), 0);
            return;
          }
          try {
            window.google.accounts.id.initialize({
              client_id: cid,
              ux_mode: 'popup',
              auto_select: false,
              callback: async (response) => {
                if (!response?.credential) {
                  addToast('Não foi possível obter o token do Google.', 'error');
                  return;
                }
                const payload = parseJwtPayload(response.credential);
                if (!payload?.email || !payload?.sub) {
                  addToast('Resposta do Google inválida.', 'error');
                  return;
                }
                setIsSubmitting(true);
                try {
                  const user = registerUser(payload.email, payload.name || 'Usuário Google');
                  onSuccess(user);
                } catch (error) {
                  addToast('Erro ao registrar com Google', 'error');
                } finally {
                  setIsSubmitting(false);
                }
              }
            });
            el.innerHTML = '';
            const w = Math.min(320, typeof window !== 'undefined' ? Math.max(260, window.innerWidth - 48) : 320);
            window.google.accounts.id.renderButton(el, {
              type: 'standard',
              theme: 'outline',
              size: 'large',
              text: 'continue_with',
              width: w,
              locale: 'pt-BR'
            });
          } catch (err) {
            console.error('[Consenso] Google Sign-In:', err);
            addToast('Erro ao iniciar o login com Google.', 'error');
          }
        };

        loadGoogleIdentityScript()
          .then(() => mountButton(true))

            console.error('[Consenso] GIS:', err);
            addToast('Falha ao carregar o Google.', 'error');
          });

          return;

        try {

          setIsSubmitting(false);

          addToast('Por favor, informe um e-mail válido', 'error');
          return;
        }

        setIsSubmitting(true);

          const user = loginUser(trimmedEmail);

          addToast('Erro ao fazer login', 'error');

          setIsSubmitting(false);
        }

                Continuar com Google

              </div>
              <div>
                <Label htmlFor="guest-email">E-mail</Label>
                <Input
                  id="guest-email"

              <div className="bg-blue-50 border border-blue-200 p-3 rounded-lg text-sm text-blue-800">
                <Icon name="Info" className="w-4 h-4 inline mr-1" />
                Seus dados são armazenados localmente. Você poderá acompanhar todas as reuniões em que participou.
              </div>
              <div className="flex flex-col gap-2">
                <Button type="submit" disabled={isSubmitting || !email.trim() || !name.trim()} className="w-full">
                  {isSubmitting ? 'Registrando...' : 'Criar Conta'}
                </Button>
                <Button type="button" variant="ghost" onClick={() => setMode('login')} className="w-full text-sm">
                  Já tenho uma conta
                </Button>
              </div>
            </form>
          )}

          {mode === 'login' && (
            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <Label htmlFor="login-email">E-mail da sua conta</Label>
                <Input
                  id="login-email"
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="jose@empresa.com"

              <div className="bg-amber-50 border border-amber-200 p-3 rounded-lg text-sm text-amber-800">
                <Icon name="Info" className="w-4 h-4 inline mr-1" />

              <div className="flex flex-col gap-2">
                <Button type="submit" disabled={isSubmitting || !email.trim()} className="w-full">

                  <GoogleLogo className="w-4 h-4" />
                  Continuar com Google
                </Button>
              </div>
            </form>
          )}

          {mode === 'google' && (
            <div className="space-y-4">
              <div className="bg-blue-50 border border-blue-200 p-3 rounded-lg text-sm text-blue-800">
                <Icon name="Info" className="w-4 h-4 inline mr-1" />
                Faça login ou crie uma conta usando sua conta Google.
              </div>
              <div ref={googleBtnRef} className="flex justify-center min-h-[44px] w-full" />
              <div className="flex flex-col gap-2">
                <Button type="button" variant="ghost" onClick={() => setMode('register')} className="w-full text-sm">
                  Criar conta com e-mail
                </Button>
                <Button type="button" variant="ghost" onClick={() => setMode('login')} className="w-full text-sm">

    const EventCreation = ({ onCreate, onCancel, addToast, topBar }) => {
      const [title, setTitle] = useState('');
      const [startDate, setStartDate] = useState(formatDate(new Date()));
      const [endDate, setEndDate] = useState(formatDate(new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)));
      const [granularity, setGranularity] = useState('hour');
      const [quorum, setQuorum] = useState(5);
      const [quorumInput, setQuorumInput] = useState('5');
      const [managerMode, setManagerMode] = useState('participant');
      const [meetingInstructions, setMeetingInstructions] = useState('');
      const [emailMode, setEmailMode] = useState('none');
      const [votingDeadline, setVotingDeadline] = useState('');
      const [automationStatus, setAutomationStatus] = useState({ deadlineReady: false, emailReady: false });
      useEffect(() => { let active = true; if (getAdminSession()?.firebaseUid) (async () => { try { await ensureConsensoGuestFirebase(); const status = await window.consensoCall('consensoAutomationStatus'); if (active) setAutomationStatus(status); } catch (error) { console.warn('[Consenso] Automação indisponível', error); } })(); return () => { active = false; }; }, []);
      const [requiredInfoLabels, setRequiredInfoLabels] = useState([]);
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleQuorumSliderChange = (value) => { setQuorum(value[0]); setQuorumInput(value[0].toString()); };
      const handleQuorumInputChange = (e) => { const value = e.target.value; setQuorumInput(value); const num = parseInt(value, 10); if (!isNaN(num) && num > 0) setQuorum(num); };

      const handleSubmit = async () => {
        if (!getAdminSession()) { addToast('Faça login como organizador para criar uma reunião', 'error'); return; }
        if (!title.trim()) { addToast('Por favor, informe o nome do evento', 'error'); return; }
        if (requiredInfoLabels.some((label) => !label.trim())) { addToast('Informe qual informação será obrigatória para votar.', 'error'); return; }
        const start = parseLocalDate(startDate), end = parseLocalDate(endDate);
        if (!startDate || !endDate || Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) { addToast('Informe datas de início e fim válidas.', 'error'); return; }
        if (start > end) { addToast('Data de início deve ser anterior à data de fim', 'error'); return; }
        if (votingDeadline && (!automationStatus.deadlineReady || new Date(votingDeadline).getTime() <= Date.now())) { addToast('Escolha um prazo futuro com a automação disponível.', 'error'); return; }
        if (emailMode !== 'none' && !automationStatus.emailReady) { addToast('O envio automático de e-mails ainda precisa ser configurado.', 'error'); return; }
        if (quorum < 2) { addToast('Quórum mínimo de 2 participantes', 'error'); return; }

        setIsSubmitting(true);
        try {
          const user = getCurrentUser();
          const config = await createEvent({ title: title.trim(), startDate: start, endDate: end, granularity, quorum, managerMode, meetingInstructions: meetingInstructions.trim(), emailMode, votingDeadline: votingDeadline ? new Date(votingDeadline).toISOString() : null, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone, automationVersion: 2, requiredInfoLabels: requiredInfoLabels.slice(0, 4).map((label) => label.trim().slice(0, 80)), earlyRevelation: false, creatorId: user.id });
          addToast('Reunião criada com sucesso!', 'success');
          onCreate(config);
        } catch (error) {
          console.error('[Consenso] Falha ao criar reunião', error);

    const VotingInterface = ({ eventId, userName, onSetUserName, onComplete, onViewResults, addToast, topBar, onUserRegistered, organizerPreparation = false, onPreparationComplete }) => {
      const [eventData, setEventData] = useState(null);
      const [loadFailed, setLoadFailed] = useState(false);
      const [localUserName, setLocalUserName] = useState(userName);
      const [notificationEmail, setNotificationEmail] = useState('');
      const [emailError, setEmailError] = useState(false);
      const emailInputRef = useRef(null);
      const [, refreshClock] = useState(0);
      useEffect(() => { const timer = setInterval(() => refreshClock((value) => value + 1), 15000); return () => clearInterval(timer); }, []);
      const [requiredInfo, setRequiredInfo] = useState([]);
      const [requiredInfoError, setRequiredInfoError] = useState(false);
      const requiredInfoRef = useRef(null);
      const [selectedSlots, setSelectedSlots] = useState(new Set());
      const [blockedSlots, setBlockedSlots] = useState(new Set());
      const [comment, setComment] = useState('');
      const [commentVisibility, setCommentVisibility] = useState('organizer');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [nameError, setNameError] = useState(false);
      const [hasVoted, setHasVoted] = useState(false);
      const [editingChoices, setEditingChoices] = useState(() => !organizerPreparation && new URLSearchParams(window.location.hash.split('?')[1] || '').has('voter'));
      const [registeredUser, setRegisteredUser] = useState(() => getRegisteredUser());
      const editingChoicesRef = useRef(false);
      const selectionInitializedRef = useRef(false);
      const [timezone, setTimezone] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const [dragValue, setDragValue] = useState(null);
      const nameInputRef = useRef(null);

      useEffect(() => {
        editingChoicesRef.current = editingChoices;
      }, [editingChoices]);

      useEffect(() => {
        let cancelled = false;
        let unsub = null;

        const applyLocalState = () => {
          const event = getEvent(eventId);
          if (!event) return false;
          setEventData(event);
          const voter = getConsensoVoterUser(eventId);
          const configuredBlocked = new Set(event.config.blockedSlots || []);
          setBlockedSlots(configuredBlocked);
          const voted = hasUserVoted(eventId, voter.id);
          setHasVoted(voted);
          if (voted && (!selectionInitializedRef.current || !editingChoicesRef.current)) {
            const existingVote = getUserVote(eventId, voter.id);
            if (existingVote) {
              setSelectedSlots(new Set(existingVote.timeSlots.filter((slot) => !configuredBlocked.has(slot))));
              setLocalUserName(existingVote.userName || '');
              setNotificationEmail(existingVote.notificationEmail || '');
              setRequiredInfo(getRequiredInfoAnswers(existingVote));
              setComment(existingVote.comment || '');
              setCommentVisibility(existingVote.commentVisibility || 'organizer');
              selectionInitializedRef.current = true;
            }
          } else if (!voted && !selectionInitializedRef.current) {
            const eventDates = getDatesInRange(event.config.startDate, event.config.endDate);
            const eventTimes = event.config.granularity === 'hour'
              ? HOUR_SLOTS
              : event.config.granularity === 'shift' ? ['morning', 'afternoon', 'evening'] : ['day'];
            setSelectedSlots(new Set(eventDates.flatMap((date) => eventTimes.map((time) => `${formatDate(date)}|${time}`)).filter((slot) => !configuredBlocked.has(slot))));
            selectionInitializedRef.current = true;
          }
          return true;
        };

        const boot = async () => {
          setLoadFailed(false);
          setTimezone(getTimezoneDisplay());
          tryHydrateEventFromInviteHash();
          let ev = getEvent(eventId);
          if (!ev) {
            // Tentar buscar do Firestore se possível
            if (consensoFirestoreReady()) {
              try {
                await ensureConsensoGuestFirebase();
              } catch (e) {
                console.error('[Consenso] auth convidado', e);
              }
              if (cancelled) return;
              const owner = await consensoFetchLookupOwnerUid(eventId);
              if (cancelled) return;
              if (owner) {
                unsub = consensoSubscribeRemoteEvent(owner, eventId, () => {
                  if (cancelled) return;
                  applyLocalState();
                });
                for (let i = 0; i < 50 && !getEvent(eventId); i++) await new Promise((r) => setTimeout(r, 80));
              }
              ev = getEvent(eventId);
            } else {
              // Se não tem auth, tentar auth anônimo para eventos synced
              const owner = await consensoFetchLookupOwnerUid(eventId);
              if (owner) {
                try {
                  await ensureConsensoGuestFirebase();
                  if (cancelled) return;
                  unsub = consensoSubscribeRemoteEvent(owner, eventId, () => {
                    if (cancelled) return;
                    applyLocalState();
                  });
                  for (let i = 0; i < 50 && !getEvent(eventId); i++) await new Promise((r) => setTimeout(r, 80));
                  ev = getEvent(eventId);
                } catch (e) {
                  console.error('[Consenso] auth convidado fallback', e);
                }
              }
            }
          }
          if (cancelled) return;
          if (!ev) {
            setLoadFailed(true);
            return;
          }
          if (!ev.config?.firebaseOwnerUid) applyLocalState();
          if (ev.config?.firebaseOwnerUid) {
            try {
              await ensureConsensoGuestFirebase();
            } catch (error) {
              if (!cancelled) { setLoadFailed(true); addToast(error.message, 'error'); }
              return;
            }
            if (cancelled) return;
            const o = ev.config.firebaseOwnerUid;
            if (!unsub) {
              unsub = consensoSubscribeRemoteEvent(o, eventId, () => {
                if (cancelled) return;
                applyLocalState();
              }, () => { if (!cancelled) setLoadFailed(true); });
            }
          }
        };

        boot();
        return () => {
          cancelled = true;
          if (unsub) unsub();
        };
      }, [eventId]);

      const dates = eventData ? getDatesInRange(eventData.config.startDate, eventData.config.endDate) : [];

      const getTimeSlots = () => {
        if (!eventData) return [];
        switch (eventData.config.granularity) {
          case 'hour': return HOUR_SLOTS;
          case 'shift': return ['morning', 'afternoon', 'evening'];
          case 'day': return ['day'];
          default: return [];
        }
      };

      const getSlotKey = (date, time) => `${formatDate(date)}|${time}`;
      const allSlotKeys = dates.flatMap((date) => getTimeSlots().map((time) => getSlotKey(date, time)));

      const setSlotsAvailability = (slotKeys, available) => {
        if (!slotsInteractive) return;
        setSelectedSlots((current) => {
          const next = new Set(current);
          slotKeys.forEach((key) => available && !blockedSlots.has(key) ? next.add(key) : next.delete(key));
          return next;
        });
      };

      const setSlotsNormalAvailable = (slotKeys) => {
        if (!slotsInteractive) return;
        if (organizerPreparation) setBlockedSlots((current) => { const next = new Set(current); slotKeys.forEach((key) => next.delete(key)); return next; });
        setSelectedSlots((current) => new Set([...current, ...slotKeys]));
      };

      const setSlotsBlocked = (slotKeys, blocked = true) => {
        if (!organizerPreparation) return;
        setBlockedSlots((current) => {
          const next = new Set(current);
          slotKeys.forEach((key) => blocked ? next.add(key) : next.delete(key));
          return next;
        });
        if (blocked) setSlotsAvailability(slotKeys, false);
      };

      const applySlotState = (slotKey, available) => {
        if (blockedSlots.has(slotKey) && !organizerPreparation) return;
        if (available === 'blocked') setSlotsBlocked([slotKey], true);
        else if (available) setSlotsNormalAvailable([slotKey]);
        else setSlotsAvailability([slotKey], false);
      };

      const toggleSlotGroup = (slotKeys) => {
        const makeAvailable = slotKeys.some((key) => !selectedSlots.has(key));
        setSlotsAvailability(slotKeys, makeAvailable);
      };

      const handleCancelEditChoices = () => {
        const voter = getConsensoVoterUser(eventId);
        const existing = getUserVote(eventId, voter.id);
        if (existing) {
          setSelectedSlots(new Set(existing.timeSlots));
          setLocalUserName(existing.userName || '');
          setNotificationEmail(existing.notificationEmail || '');
          setEmailError(false);
          setNameError(false);
          setRequiredInfo(getRequiredInfoAnswers(existing));
          setRequiredInfoError(false);
          setComment(existing.comment || '');
          setCommentVisibility(existing.commentVisibility || 'organizer');
        }
        setEditingChoices(false);
      };

      const handleMouseDown = (slotKey) => {
        if (hasVoted && !editingChoices) return;
        setIsDragging(true);
        const nextState = organizerPreparation ? (blockedSlots.has(slotKey) ? 'unblocked' : 'blocked') : !selectedSlots.has(slotKey);
        setDragValue(nextState);
        if (organizerPreparation) setSlotsBlocked([slotKey], nextState === 'blocked'); else applySlotState(slotKey, nextState);
      };

      const handleMouseEnter = (slotKey) => {
        if (!isDragging || dragValue === null) return;
        if (organizerPreparation) setSlotsBlocked([slotKey], dragValue === 'blocked'); else applySlotState(slotKey, dragValue);
      };

      useEffect(() => {
        const handleGlobalMouseUp = () => { setIsDragging(false); setDragValue(null); };
        document.addEventListener('mouseup', handleGlobalMouseUp);
        document.addEventListener('pointerup', handleGlobalMouseUp);
        document.addEventListener('pointercancel', handleGlobalMouseUp);
        return () => {
          document.removeEventListener('mouseup', handleGlobalMouseUp);
          document.removeEventListener('pointerup', handleGlobalMouseUp);
          document.removeEventListener('pointercancel', handleGlobalMouseUp);
        };
      }, []);

      const handleSubmit = async (skipPrompt = false) => {
        if (!organizerPreparation && !eventData.config.votingOpened && eventData.config.votingOpened !== undefined) { addToast('A votação ainda não foi aberta pelo organizador.', 'error'); return; }
        if (!organizerPreparation && !isValidFullName(localUserName)) {
          setNameError(true);
          addToast('Informe seu nome completo (nome e sobrenome) no campo destacado.', 'error');
          setTimeout(() => nameInputRef.current?.focus(), 0);
          return;
        }
        if (!organizerPreparation && isVotingClosed(eventData.config)) { addToast('A votação já foi encerrada para apuração.', 'error'); return; }
        if (!organizerPreparation && ((eventData.config.emailMode === 'required' && !notificationEmail.trim()) || (notificationEmail.trim() && !isValidNotificationEmail(notificationEmail.trim())))) { setEmailError(true); addToast('Informe um e-mail válido para receber o resultado.', 'error'); setTimeout(() => emailInputRef.current?.focus(), 0); return; }
        setEmailError(false);
        const requiredLabels = getRequiredInfoLabels(eventData.config);
        const missingInfoIndex = requiredLabels.findIndex((label, index) => !requiredInfo[index]?.trim());
        if (!organizerPreparation && missingInfoIndex >= 0) {
          setRequiredInfoError(true);
          addToast(`Informe ${requiredLabels[missingInfoIndex]} para confirmar o voto.`, 'error');
          setTimeout(() => requiredInfoRef.current?.querySelector('input[aria-invalid="true"]')?.focus(), 0);
          return;
        }
        setRequiredInfoError(false);
        setNameError(false);
        setIsSubmitting(true);
        try {
          if (eventData.config.firebaseOwnerUid) {
            await ensureConsensoGuestFirebase();
            if (!window.consensoFirebaseUser?.uid) throw new Error('Autenticação do convidado indisponível');
          }
          if (organizerPreparation) {
            await activateEventVoting(eventId, Array.from(blockedSlots));
            addToast('Grade confirmada. A votação está aberta e o link foi liberado!', 'success');
            if (onPreparationComplete) onPreparationComplete(getEvent(eventId));
            return;
          }
          const oldUser = getConsensoVoterUser(eventId);
          const cloudEvent = getEvent(eventId);
          const user = cloudEvent?.config?.firebaseOwnerUid ? oldUser : (registeredUser || oldUser);
          
          // Se o usuário se registrou, migrar o voto se foi anônimo
          if (!cloudEvent?.config?.firebaseOwnerUid && registeredUser && oldUser.id !== registeredUser.id) {
            const previousAnonymousVote = getUserVote(eventId, oldUser.id);
            if (previousAnonymousVote) {
              mergeAnonymousVoteToRegistered(oldUser.id, registeredUser.id, eventId);
            }
          }

          onSetUserName(normalizeFullName(localUserName));
          const votePayload = {
              userId: user.id,
              userName: normalizeFullName(localUserName),
              ...(['optional', 'required'].includes(eventData.config.emailMode) && notificationEmail.trim() ? { notificationEmail: notificationEmail.trim() } : {}),
              ...(requiredLabels.length ? { requiredInfoAnswers: requiredLabels.map((label, index) => requiredInfo[index].trim()), ...(eventData.config.requiredInfoLabel && !eventData.config.requiredInfoLabels ? { requiredInfo: requiredInfo[0].trim() } : {}) } : {}),
              timeSlots: Array.from(selectedSlots).filter((slot) => !blockedSlots.has(slot)),
              preferredSlots: [],
              comment: comment.trim().slice(0, 1000),
              commentVisibility,
              removePublicComment: getUserVote(eventId, user.id)?.commentVisibility === 'everyone' && (commentVisibility !== 'everyone' || !comment.trim()),
            };
          await submitVote(eventId, votePayload);
          trackParticipatedEvent(eventId);
          addToast(hasVoted ? 'Voto atualizado!' : 'Voto registrado!', 'success');
          setHasVoted(true);
          setEditingChoices(false);
          setEventData(getEvent(eventId));
          const evCloud = getEvent(eventId);
          if (!evCloud?.config?.firebaseOwnerUid || !consensoFirestoreReady()) {
            setVoteHashFromInviteLink(eventId);
            try {
              await navigator.clipboard.writeText(window.location.href);
            } catch {}
          }
          onComplete();
        } catch (error) {
          console.error('[Consenso] Falha ao salvar voto', error);
          addToast(organizerPreparation
            ? (error?.code === 'permission-denied' ? 'Não foi possível abrir a votação: acesso do organizador recusado. Entre novamente e tente outra vez.' : 'Não foi possível confirmar a grade. Verifique a conexão e tente novamente.')
