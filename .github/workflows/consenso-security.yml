name: Consenso - testes e seguranca
on:
  push:
    branches: [main]
    paths: ['consenso/syncpriv-app/**', '.github/workflows/consenso-security.yml']
  pull_request:
    paths: ['consenso/syncpriv-app/**', '.github/workflows/consenso-security.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: consenso-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Runners padrao sao gratuitos em repositorios publicos; nao executar se ficar privado.
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consenso/syncpriv-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: consenso/syncpriv-app/functions
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: consenso/syncpriv-app/functions
      - run: node --check functions/index.cjs
      - name: Preparar CLI do emulador
        run: |
          npm install --global firebase-tools@15.34.1 --ignore-scripts
          echo "FIREBASE_TOOLS_ROOT=$(npm root -g)/firebase-tools" >> "$GITHUB_ENV"
      - run: npm run test:rules
